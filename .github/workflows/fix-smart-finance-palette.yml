name: Sync Akıllı Finans theme

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply targeted palette fix
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          marker = '<style id="ff-smart-finance-palette-fix">'
          end = '</style>'
          css = r'''<style id="ff-smart-finance-palette-fix">
          /* Targeted fix: Akıllı Finans always follows the active theme palette. */
          .ff-theme-smart-finance,
          .ai-finance-btn,
          .smart-finance-btn {
            color: var(--purple) !important;
            border-color: color-mix(in srgb, var(--purple) 62%, transparent) !important;
            background: linear-gradient(145deg, color-mix(in srgb, var(--purple) 88%, white 12%), var(--purple2)) !important;
            box-shadow: 0 8px 24px color-mix(in srgb, var(--purple) 34%, transparent) !important;
          }
          .ff-theme-smart-finance svg,
          .ai-finance-btn svg,
          .smart-finance-btn svg {
            color: var(--purple) !important;
            stroke: currentColor !important;
            filter: drop-shadow(0 0 6px color-mix(in srgb, var(--purple) 45%, transparent)) !important;
          }
          .ff-theme-smart-finance small,
          .ff-theme-smart-finance span,
          .ai-finance-btn small,
          .ai-finance-btn span,
          .smart-finance-btn small,
          .smart-finance-btn span {
            color: inherit !important;
          }
          </style>'''

          if marker in text:
              text = re.sub(re.escape(marker) + r'.*?</style>', css, text, count=1, flags=re.S)
          elif '</head>' in text:
              text = text.replace('</head>', css + '</head>', 1)
          else:
              text = css + text

          script_marker = '<script id="ff-smart-finance-palette-js">'
          script = r'''<script id="ff-smart-finance-palette-js">
          (() => {
            const label = 'Akıllı Finans';
            const selector = 'button, .nav, [role="button"], a';
            const apply = () => {
              document.querySelectorAll(selector).forEach(el => {
                const text = (el.textContent || '').replace(/\s+/g, ' ').trim();
                if (!text.includes(label)) return;
                el.classList.add('ff-theme-smart-finance');
                const root = getComputedStyle(document.documentElement);
                const purple = root.getPropertyValue('--purple').trim() || '#743cff';
                const purple2 = root.getPropertyValue('--purple2').trim() || '#4c1ed4';
                el.style.setProperty('color', purple, 'important');
                el.style.setProperty('background', `linear-gradient(145deg, ${purple}, ${purple2})`, 'important');
                el.style.setProperty('border-color', purple, 'important');
                el.style.setProperty('box-shadow', `0 8px 24px ${purple}55`, 'important');
              });
            };
            if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', apply);
            else apply();
            new MutationObserver(apply).observe(document.documentElement, {subtree:true, childList:true, attributes:true, attributeFilter:['class','style','data-palette']});
          })();
          </script>'''

          if script_marker in text:
              text = re.sub(re.escape(script_marker) + r'.*?</script>', script, text, count=1, flags=re.S)
          elif '</body>' in text:
              text = text.replace('</body>', script + '</body>', 1)
          else:
              text += script

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit patched index and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/fix-smart-finance-palette.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'fix: make Akıllı Finans follow theme palette'
          git push
