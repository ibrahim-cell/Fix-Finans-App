name: Fix Google reconnect

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[google-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          original = s

          old = '''    if(user.photoURL){
      try{
        const photo=await fetch(user.photoURL,{mode:'cors'}).then(r=>r.blob());
        if(photo.type.startsWith('image/')){
          const reader=new FileReader();
          reader.onload=()=>{localStorage.setItem('fix_profile_photo',reader.result);render();};
          reader.readAsDataURL(photo);
        }
      }catch(e){}
    }
    sessionStorage.removeItem('fix_guest_session');
    localStorage.setItem('fix_welcome_completed','1');
    if(typeof render==='function')render();
    closeWelcome();'''
          new = '''    sessionStorage.removeItem('fix_guest_session');
    localStorage.setItem('fix_welcome_completed','1');
    setGoogleButtonBusy(false);
    if(typeof render==='function')render();
    closeWelcome();
    if(user.photoURL){
      Promise.resolve().then(()=>fetch(user.photoURL,{mode:'cors'})).then(r=>r.blob()).then(photo=>{
        if(!photo.type.startsWith('image/')) return;
        const reader=new FileReader();
        reader.onload=()=>{localStorage.setItem('fix_profile_photo',reader.result);if(typeof render==='function')render();};
        reader.readAsDataURL(photo);
      }).catch(()=>{});
    }'''
          if old not in s:
              raise SystemExit('finishGoogleUser block not found')
          s = s.replace(old, new, 1)

          old = "function openWelcome(){const w=document.getElementById('fixWelcome');if(w)w.classList.remove('hidden')}"
          new = "function openWelcome(){const w=document.getElementById('fixWelcome');if(w)w.classList.remove('hidden');if(typeof setGoogleButtonBusy==='function')setGoogleButtonBusy(false)}"
          if old not in s:
              raise SystemExit('openWelcome function not found')
          s = s.replace(old, new, 1)

          old = '''      window.fixFirebaseUser=null;
      sessionStorage.removeItem('fix_guest_session');
      localStorage.removeItem('fix_welcome_completed');
      render();
      syncWelcomeGate();
      showToast('Google bağlantısı kesildi.');'''
          new = '''      window.fixFirebaseUser=null;
      sessionStorage.removeItem('fix_guest_session');
      localStorage.removeItem('fix_welcome_completed');
      if(typeof setGoogleButtonBusy==='function')setGoogleButtonBusy(false);
      render();
      openWelcome();
      syncWelcomeGate();
      showToast('Google bağlantısı kesildi.');'''
          if old not in s:
              raise SystemExit('logout success block not found')
          s = s.replace(old, new, 1)

          if s == original:
              raise SystemExit('No changes made')
          p.write_text(s, encoding='utf-8')
          print(f'Patched index.html: {len(original)} -> {len(s)} bytes')

      - name: Commit and push
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Fix Google reconnect UI [google-fix]'
          git push
