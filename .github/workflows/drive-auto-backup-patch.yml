name: Drive auto backup patch
on: [push]
permissions:
  contents: write
jobs:
  patch:
    if: "!contains(github.event.head_commit.message, 'automatically backup changes')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = "const persist=()=>{localStorage.removeItem('fix_notifications_cleared');localStorage.setItem(STORAGE_KEY,JSON.stringify(state.transactions));localStorage.setItem(DEBT_KEY,JSON.stringify(state.debts));localStorage.setItem('fix_upcoming',JSON.stringify(state.upcoming||[]));localStorage.setItem(RECURRING_KEY,JSON.stringify(state.recurring||[]));localStorage.setItem(GOAL_KEY,JSON.stringify(state.financialGoals||[]));localStorage.setItem('fix_credit_card',JSON.stringify(state.creditCard||{limit:0}));localStorage.setItem('fix_custom_categories',JSON.stringify(state.customCategories||{Gelir:[],Gider:[]}));if(typeof maybeAutoBackup==='function')setTimeout(()=>maybeAutoBackup(false),0);};"
          new = "let fixCloudBackupTimer=null,fixCloudBackupInFlight=false,fixCloudBackupQueued=false,fixRestoreInProgress=false;\nconst persist=()=>{localStorage.removeItem('fix_notifications_cleared');localStorage.setItem(STORAGE_KEY,JSON.stringify(state.transactions));localStorage.setItem(DEBT_KEY,JSON.stringify(state.debts));localStorage.setItem('fix_upcoming',JSON.stringify(state.upcoming||[]));localStorage.setItem(RECURRING_KEY,JSON.stringify(state.recurring||[]));localStorage.setItem(GOAL_KEY,JSON.stringify(state.financialGoals||[]));localStorage.setItem('fix_credit_card',JSON.stringify(state.creditCard||{limit:0}));localStorage.setItem('fix_custom_categories',JSON.stringify(state.customCategories||{Gelir:[],Gider:[]}));if(typeof maybeAutoBackup==='function')setTimeout(()=>maybeAutoBackup(false),0);if(typeof scheduleCloudAutoBackup==='function')scheduleCloudAutoBackup();};"
          if old not in s: raise SystemExit('persist anchor not found')
          s = s.replace(old,new,1)
          old = "function backupData(){performBackup(true,false)}\nfunction getAutoBackupMode()"
          new = "function backupData(){performBackup(true,false)}\nfunction cloudAutoBackupEnabled(){return !!window.AndroidGoogleDrive?.authorize&&(fixDriveTokenValid()||localStorage.getItem('fix_drive_connected')==='1')}\nfunction scheduleCloudAutoBackup(){if(fixRestoreInProgress||!cloudAutoBackupEnabled())return;clearTimeout(fixCloudBackupTimer);fixCloudBackupTimer=setTimeout(()=>autoBackupToGoogleDrive().catch(()=>{}),900)}\nasync function autoBackupToGoogleDrive(){if(fixRestoreInProgress||!cloudAutoBackupEnabled())return;if(fixCloudBackupInFlight){fixCloudBackupQueued=true;return}fixCloudBackupInFlight=true;fixCloudBackupQueued=false;try{const payload=makeBackupPayload();await fixDriveGetToken();await fixDriveUploadPayload(payload);localStorage.setItem('fix_last_cloud_backup',new Date().toISOString())}catch(e){if(String(e?.message||'').toLowerCase().includes('cancel'))localStorage.removeItem('fix_drive_connected')}finally{fixCloudBackupInFlight=false;if(fixCloudBackupQueued)autoBackupToGoogleDrive().catch(()=>{})}}\nfunction getAutoBackupMode()"
          if old not in s: raise SystemExit('backup anchor not found')
          s = s.replace(old,new,1)
          old = "async function connectGoogleDrive(){if(!window.AndroidGoogleDrive?.authorize){showToast('Google Drive bağlantısı web sürümünde devre dışıdır. Fix Finans Android uygulamasından bağlanabilirsin.');return}try{await fixDriveGetToken(true);showToast('Google Drive bağlandı.');await openGoogleDrivePanel()}catch(e){showToast(e.message||'Google Drive yetkilendirmesi tamamlanamadı. Lütfen tekrar deneyin.')}}"
          new = "async function connectGoogleDrive(){if(!window.AndroidGoogleDrive?.authorize){showToast('Google Drive bağlantısı web sürümünde devre dışıdır. Fix Finans Android uygulamasından bağlanabilirsin.');return}try{await fixDriveGetToken(true);localStorage.setItem('fix_drive_connected','1');showToast('Google Drive bağlandı.');await autoBackupToGoogleDrive();await openGoogleDrivePanel()}catch(e){showToast(e.message||'Google Drive yetkilendirmesi tamamlanamadı. Lütfen tekrar deneyin.')}}"
          if old not in s: raise SystemExit('connect anchor not found')
          s = s.replace(old,new,1)
          old = "async function restoreFromGoogleDrive(fileId,fileName,confirmed=false){try{if(!confirmed){openDriveActionConfirm('restore',fileId,fileName);return}const payload=await fixDriveDownload(fileId);backupRestorePayload(payload);persist();showToast('Google Drive yedeği geri yüklendi.');closeModal();if(typeof renderApp==='function')renderApp();else if(typeof renderAll==='function')renderAll();else location.reload()}catch(e){showToast(e.message||'Google Drive yedeği geri yüklenemedi.');await openGoogleDrivePanel()}}"
          new = "async function restoreFromGoogleDrive(fileId,fileName,confirmed=false){try{if(!confirmed){openDriveActionConfirm('restore',fileId,fileName);return}fixRestoreInProgress=true;clearTimeout(fixCloudBackupTimer);const payload=await fixDriveDownload(fileId);backupRestorePayload(payload);showToast('Google Drive yedeği geri yüklendi.');closeModal();if(typeof renderApp==='function')renderApp();else if(typeof renderAll==='function')renderAll();else location.reload()}catch(e){showToast(e.message||'Google Drive yedeği geri yüklenemedi.');await openGoogleDrivePanel()}finally{fixRestoreInProgress=false}}"
          if old not in s: raise SystemExit('restore anchor not found')
          s = s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "feat: automatically backup changes"
          git push
