name: Inspect Google reconnect

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract reconnect logic
        shell: python
        run: |
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          keys=['Google','signOut','signout','logout','disconnect','bağlant','auth','firebase']
          hits=[]
          for key in keys:
              for m in re.finditer(re.escape(key), s, flags=re.I):
                  a=max(0,m.start()-1200); b=min(len(s),m.end()+2200)
                  hits.append((m.start(), f'===== {key} @ {m.start()} =====\n{s[a:b]}'))
          hits=sorted(hits, key=lambda x:x[0])
          # Deduplicate overlapping windows and keep a manageable report.
          selected=[]; last=-10**9
          for pos, block in hits:
              if pos-last < 1500: continue
              selected.append(block); last=pos
          Path('GOOGLE_RECONNECT_REPORT.txt').write_text('\n\n'.join(selected[:120]), encoding='utf-8')
      - name: Commit temporary report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add GOOGLE_RECONNECT_REPORT.txt
          git commit -m "Temporary Google reconnect report" || true
          git push
