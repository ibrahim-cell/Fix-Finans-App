name: Fix welcome logo once 2

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Pillow
        run: python -m pip install pillow

      - name: Fix welcome logo and welcome image tag
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          from PIL import Image

          p = Path("fix-finans-welcome-mark.png")
          if p.exists():
              im = Image.open(p).convert("RGBA")
              gray = im.convert("L")
              alpha = gray.point(lambda v: 0 if v <= 5 else 255)
              im.putalpha(alpha)
              im.save(p, optimize=True)

          index = Path("index.html")
          if index.exists():
              s = index.read_text(encoding="utf-8")
              marker = "Google ile Devam Et"
              pos = s.find(marker)
              if pos >= 0:
                  start = max(0, pos - 5000)
                  chunk = s[start:pos]
                  img_start = chunk.rfind("<img")
                  if img_start >= 0:
                      abs_start = start + img_start
                      img_end = s.find(">", abs_start)
                      if img_end >= 0:
                          tag = s[abs_start:img_end + 1]
                          tag = re.sub(r'\s+src\s*=\s*(["\']).*?\1', '', tag, flags=re.I)
                          tag = re.sub(r'\s+alt\s*=\s*(["\']).*?\1', '', tag, flags=re.I)
                          tag = tag[:-1] + ' src="fix-finans-welcome-mark.png" alt="">'
                          s = s[:abs_start] + tag + s[img_end + 1:]
              s = s.replace('alt="Fix Finans" loading="eager">', '')
              s = s.replace("alt='Fix Finans' loading='eager'>", "")
              index.write_text(s, encoding="utf-8")

          Path(".github/workflows/fix-welcome-once.yml").unlink(missing_ok=True)
          Path(".github/workflows/fix-welcome-once-2.yml").unlink(missing_ok=True)
          PY

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fix-finans-welcome-mark.png index.html .github/workflows/fix-welcome-once.yml .github/workflows/fix-welcome-once-2.yml
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Fix transparent welcome logo"
          git push
