name: Repair Akıllı Finans Theme Fix

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/repair-smart-finance-theme.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Repair only the accidental markup and target the real button
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          original = s

          s = s.replace(
              '<div class="app smart-finance-theme-button"<header',
              '<div class="app"><header',
              1
          )
          s = s.replace(
              '<div class="smart-center-head"><div><div class="smart-kicker smart-finance-theme-button"AKILLI FİNANS</div>',
              '<div class="smart-center-head"><div><div class="smart-kicker">AKILLI FİNANS</div>',
              1
          )
          s = s.replace(
              '<button class="add premium-add premium-smart" id="smartFinanceAction"',
              '<button class="add premium-add premium-smart smart-finance-theme-button" id="smartFinanceAction"',
              1
          )

          if s == original:
              raise SystemExit('No expected accidental markup found; refusing to change anything.')

          p.write_text(s, encoding='utf-8')

      - name: Verify
        run: |
          grep -n -m 2 'smart-finance-theme-button' index.html
          grep -n -m 1 '<div class="app"><header' index.html
          grep -n -m 1 'smart-kicker">AKILLI FİNANS' index.html
          git diff --check

      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix: correctly target Akıllı Finans home button'
          git push

      - name: Remove temporary workflow
        if: success()
        run: |
          git rm .github/workflows/repair-smart-finance-theme.yml
          git commit -m 'chore: remove temporary repair workflow'
          git push
