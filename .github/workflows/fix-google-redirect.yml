name: Fix Google Redirect

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Switch Google sign-in to redirect
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = """      // GitHub Pages gibi Firebase Hosting dışındaki alan adlarında popup,\n      // redirect akışındaki üçüncü taraf depolama kısıtlarından daha güvenilirdir.\n      const result=await auth.signInWithPopup(provider);"""
          new = """      // TWA/Chrome Custom Tab içinde popup akışı takılabildiği için Google\n      // kimlik doğrulamasını redirect ile tamamla ve dönüşte getRedirectResult\n      // ile oturumu işle.\n      await auth.signInWithRedirect(provider);\n      return;"""
          if old not in s:
              print('Google popup snippet already changed or not found; no update needed.')
              raise SystemExit(0)
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          print('Google sign-in switched to redirect.')

      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Fix Google sign-in redirect in TWA"
            git push
          fi
