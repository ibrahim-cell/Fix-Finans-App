name: Fix Akıllı Finans Theme

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-smart-finance-theme.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply targeted UI fix
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          original = s

          labels = ('AKILLI FİNANS', 'AKILLI FINANS')
          added = False
          for label in labels:
              pos = 0
              while True:
                  i = s.upper().find(label, pos)
                  if i < 0:
                      break
                  candidates = [s.rfind('<button', 0, i), s.rfind('<a ', 0, i), s.rfind('<div', 0, i)]
                  start = max(candidates)
                  if start >= 0 and i - start < 1800:
                      end = s.find('>', start, i + 1)
                      if end >= 0:
                          tag = s[start:end]
                          if 'smart-finance-theme-button' not in tag:
                              m = re.search(r'\sclass=("[^"]*"|\'[^\']*\')', tag)
                              if m:
                                  quote = m.group(1)[0]
                                  inner = m.group(1)[1:-1]
                                  new_tag = tag[:m.start()] + ' class=' + quote + inner + ' smart-finance-theme-button' + quote + tag[m.end():]
                              else:
                                  new_tag = tag[:-1] + ' class="smart-finance-theme-button">'
                              s = s[:start] + new_tag + s[end+1:]
                              added = True
                          break
                  pos = i + len(label)

          css = '''\n<style id="smart-finance-theme-fix">\n.smart-finance-theme-button {\n  background: linear-gradient(135deg, var(--purple), var(--purple2)) !important;\n  border: 1px solid color-mix(in srgb, var(--purple) 70%, #ffffff 8%) !important;\n  color: #ffffff !important;\n  box-shadow: 0 8px 24px color-mix(in srgb, var(--purple) 28%, transparent) !important;\n}\n.smart-finance-theme-button * { color: inherit !important; }\n</style>\n'''
          if 'id="smart-finance-theme-fix"' not in s:
              s = s.replace('</head>', css + '</head>', 1)

          if s == original:
              raise SystemExit('No safe target change detected; refusing to modify the project.')

          p.write_text(s, encoding='utf-8')
          print('Target class added:', added)
          print('index.html updated:', len(s) - len(original), 'bytes')

      - name: Verify target and diff
        run: |
          grep -n -m 3 'smart-finance-theme-button' index.html
          git diff --stat
          git diff --check

      - name: Commit targeted fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix: sync Akıllı Finans button with active theme palette'
          git push

      - name: Remove temporary workflow
        if: success()
        run: |
          git rm .github/workflows/fix-smart-finance-theme.yml
          git commit -m 'chore: remove temporary theme fix workflow'
          git push
