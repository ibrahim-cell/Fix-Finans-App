name: Fix Akıllı Finans Theme

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply targeted UI fix
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          original = s

          # Find the actual bottom-nav control by its visible label and add a
          # dedicated class without touching any calculation or feature code.
          labels = ('AKILLI FİNANS', 'AKILLI FINANS')
          added = False
          for label in labels:
              pos = 0
              while True:
                  i = s.upper().find(label, pos)
                  if i < 0:
                      break
                  start = max(0, s.rfind('<button', 0, i), s.rfind('<a ', 0, i), s.rfind('<div', 0, i))
                  if start >= 0 and i - start < 1800:
                      end = s.find('>', start, i + 1)
                      if end >= 0:
                          tag = s[start:end]
                          if 'smart-finance-theme-button' not in tag:
                              tag2 = re.sub(r'\sclass=("[^"]*"|\'[^\']*\')', lambda m: m.group(0)[:-1] + ' smart-finance-theme-button' + m.group(1)[-1], tag, count=1)
                              if tag2 == tag:
                                  tag2 = tag[:-1] + ' class="smart-finance-theme-button">'
                              s = s[:start] + tag2 + s[end+1:]
                              added = True
                          break
                  pos = i + len(label)

          # Theme variables already drive the rest of the app. The previous
          # fixed yellow styling on this one control is overridden to consume
          # the active palette variables as well.
          css = '''\n<style id="smart-finance-theme-fix">\n.smart-finance-theme-button {\n  background: linear-gradient(135deg, var(--purple), var(--purple2)) !important;\n  border: 1px solid color-mix(in srgb, var(--purple) 70%, #ffffff 8%) !important;\n  color: #ffffff !important;\n  box-shadow: 0 8px 24px color-mix(in srgb, var(--purple) 28%, transparent) !important;\n}\n.smart-finance-theme-button * { color: inherit !important; }\nbody[data-palette="blue"] .smart-finance-theme-button {\n  background: linear-gradient(135deg, var(--purple), var(--purple2)) !important;\n}\n</style>\n'''
          if 'id="smart-finance-theme-fix"' not in s:
              s = s.replace('</head>', css + '</head>', 1)

          if s == original:
              raise SystemExit('No safe target change detected; refusing to modify the project.')

          p.write_text(s, encoding='utf-8')
          print('Target class added:', added)
          print('index.html updated:', len(s) - len(original), 'bytes')

      - name: Verify target and diff
        run: |
          grep -n -m 3 'smart-finance-theme-button' index.html
          git diff --stat
          git diff --check

      - name: Commit targeted fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix: sync Akıllı Finans button with active theme palette'
          git push

      - name: Remove temporary workflow
        if: success()
        run: |
          git rm .github/workflows/fix-smart-finance-theme.yml
          git commit -m 'chore: remove temporary theme fix workflow'
          git push
