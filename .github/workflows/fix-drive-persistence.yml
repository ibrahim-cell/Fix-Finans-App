name: Fix Drive persistence

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch MainActivity
        shell: bash
        run: |
          python3 -c 'from pathlib import Path; p=Path("app/src/main/java/com/fixfinans/app/MainActivity.java"); s=p.read_text(); assert "DRIVE_PREFS" not in s; s=s.replace("import android.content.IntentSender;\n", "import android.content.IntentSender;\nimport android.content.SharedPreferences;\n", 1); s=s.replace("    private static final String DRIVE_SCOPE = \"https://www.googleapis.com/auth/drive.file\";\n", "    private static final String DRIVE_SCOPE = \"https://www.googleapis.com/auth/drive.file\";\n    private static final String DRIVE_PREFS = \"fix_finans_drive\";\n    private static final String DRIVE_CONNECTED_KEY = \"connected\";\n", 1); s=s.replace("    private boolean googleSignInInProgress = false;\n", "    private boolean googleSignInInProgress = false;\n    private boolean driveAutoRestoreAttempted = false;\n", 1); old="""                if (isTrustedAppUrl(url)) {\n                    installNativeGoogleBridge();\n                } else {"""; new="""                if (isTrustedAppUrl(url)) {\n                    installNativeGoogleBridge();\n                    if (!driveAutoRestoreAttempted && isDriveMarkedConnected()) {\n                        driveAutoRestoreAttempted = true;\n                        view.postDelayed(MainActivity.this::nativeGoogleDriveAuthorize, 250);\n                    }\n                } else {"""; assert old in s; s=s.replace(old,new,1); old="""    private void nativeGoogleDriveAuthorize() {\n        if (authorizationClient == null) {"""; new="""    private boolean isDriveMarkedConnected() {\n        return getSharedPreferences(DRIVE_PREFS, MODE_PRIVATE).getBoolean(DRIVE_CONNECTED_KEY, false);\n    }\n\n    private void setDriveMarkedConnected(boolean connected) {\n        getSharedPreferences(DRIVE_PREFS, MODE_PRIVATE).edit().putBoolean(DRIVE_CONNECTED_KEY, connected).apply();\n    }\n\n    private void nativeGoogleDriveAuthorize() {\n        if (authorizationClient == null) {"""; assert old in s; s=s.replace(old,new,1); old="""        sendNativeDriveSuccess(accessToken);"""; new="""        setDriveMarkedConnected(true);\n        sendNativeDriveSuccess(accessToken);"""; assert old in s; s=s.replace(old,new,1); p.write_text(s)' 
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/fixfinans/app/MainActivity.java
          git commit -m "Fix persistent Google Drive connection"
          git push
