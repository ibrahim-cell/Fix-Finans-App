<style id="fix-13316-fab-premium-pulse">
/* Fix Finans 13.3.16 — slightly stronger premium FAB breathing + sparkle.
   Visual-only. Existing FAB HTML, JS, navigation and calculations remain untouched. */

.bottom .add{
  --fab-accent:var(--theme-accent,var(--purple));
  --fab-accent-2:var(--theme-accent-2,var(--purple2));
  background:
    radial-gradient(circle at 34% 27%,rgba(255,255,255,.34),transparent 23%),
    linear-gradient(145deg,
      color-mix(in srgb,var(--fab-accent) 90%,white 10%),
      var(--fab-accent) 48%,
      var(--fab-accent-2) 100%) !important;
  border-color:color-mix(in srgb,var(--fab-accent) 68%,white 32%) !important;
  box-shadow:
    0 10px 28px color-mix(in srgb,var(--fab-accent) 38%,transparent),
    0 0 0 5px color-mix(in srgb,var(--fab-accent) 10%,transparent),
    0 0 28px color-mix(in srgb,var(--fab-accent) 30%,transparent),
    inset 0 1px rgba(255,255,255,.58) !important;
  isolation:isolate !important;
  animation:fixFabPremiumBreathe 3.4s ease-in-out infinite !important;
}

.bottom .add::before{
  content:"" !important;
  position:absolute !important;
  inset:-8px !important;
  z-index:-1 !important;
  border-radius:50% !important;
  border:1px solid color-mix(in srgb,var(--fab-accent) 50%,transparent) !important;
  opacity:.38 !important;
  transform:scale(.88) !important;
  animation:fixFabPremiumAura 3.4s ease-in-out infinite !important;
  pointer-events:none !important;
}

.bottom .add::after{
  content:"" !important;
  position:absolute !important;
  top:7% !important;
  left:-28% !important;
  width:20% !important;
  height:86% !important;
  border-radius:999px !important;
  background:linear-gradient(180deg,transparent,rgba(255,255,255,.88),transparent) !important;
  filter:blur(.8px) !important;
  opacity:0 !important;
  transform:rotate(19deg) translateX(-18px) !important;
  animation:fixFabPremiumSparkle 4.8s ease-in-out infinite !important;
  pointer-events:none !important;
}

@keyframes fixFabPremiumBreathe{
  0%,100%{
    transform:scale(1);
    box-shadow:
      0 10px 28px color-mix(in srgb,var(--fab-accent) 34%,transparent),
      0 0 0 5px color-mix(in srgb,var(--fab-accent) 8%,transparent),
      0 0 23px color-mix(in srgb,var(--fab-accent) 23%,transparent),
      inset 0 1px rgba(255,255,255,.54);
  }
  50%{
    transform:scale(1.035);
    box-shadow:
      0 12px 32px color-mix(in srgb,var(--fab-accent) 44%,transparent),
      0 0 0 9px color-mix(in srgb,var(--fab-accent) 13%,transparent),
      0 0 39px color-mix(in srgb,var(--fab-accent) 38%,transparent),
      inset 0 1px rgba(255,255,255,.64);
  }
}

@keyframes fixFabPremiumAura{
  0%,100%{opacity:.24;transform:scale(.88)}
  50%{opacity:.62;transform:scale(1.12)}
}

@keyframes fixFabPremiumSparkle{
  0%,58%{opacity:0;transform:rotate(19deg) translateX(-18px)}
  63%{opacity:.92}
  70%{opacity:0;transform:rotate(19deg) translateX(360px)}
  100%{opacity:0;transform:rotate(19deg) translateX(360px)}
}

@media (prefers-reduced-motion:reduce){
  .bottom .add,
  .bottom .add::before,
  .bottom .add::after{
    animation:none !important;
  }
}
</style>

function financialScoreBreakdown(t){
  if(!t || !t.income) return null;
  const income=Number(t.income)||0;
  const expense=Number(t.expense)||0;
  const net=Number(t.net)||0;
  const savingsRate=net/income;
  const expenseRate=expense/income;
  const debt=state.debts.filter(d=>d[0]==='Borç'&&!isDebtSettled(d)).reduce((a,d)=>a+Math.abs(Number(d[1])||0),0);
  const receivable=state.debts.filter(d=>d[0]==='Alacak'&&!isDebtSettled(d)).reduce((a,d)=>a+Math.abs(Number(d[1])||0),0);
  const netDebt=Math.max(0,debt-receivable);
  const debtRate=netDebt/income;
  /* Tek ve ortak skor motoru: 40 Tasarruf + 35 Gider Kontrolü + 25 Net Borç Baskısı = 100.
     Transferler skora girmez. Kredi kartı ayrı bonus değildir; kredi kartı harcamaları Gider içinde zaten değerlendirilir. */
  const savingsScore=Math.round(Math.max(0,Math.min(1,savingsRate/0.50))*40);
  const expenseScore=expenseRate<=0.50?35:expenseRate<=0.60?30:expenseRate<=0.70?25:expenseRate<=0.80?15:expenseRate<=0.90?7:0;
  const debtScore=netDebt===0?25:debtRate<=0.25?20:debtRate<=0.50?15:debtRate<=0.75?10:debtRate<=1?5:0;
  const score=Math.max(0,Math.min(100,savingsScore+expenseScore+debtScore));
  return {income,expense,net,savingsRate,expenseRate,netDebt,debtRate,savingsScore,expenseScore,debtScore,score};
}
function calculateFinancialScore(t){
  const breakdown=financialScoreBreakdown(t);
  return breakdown?breakdown.score:null;
}
const calculateHomeFinancialScore=calculateFinancialScore;
function smartHomeSummary(t){
  const expenseRatio=t.income?Math.round(t.expense/t.income*100):0;
  const netRatio=t.income?Math.round(t.net/t.income*100):0;
  const debtBorç=state.debts.filter(d=>d[0]==='Borç'&&!isDebtSettled(d)).reduce((a,d)=>a+Math.abs(Number(d[1]||0)),0);
  const debtAlacak=state.debts.filter(d=>d[0]==='Alacak'&&!isDebtSettled(d)).reduce((a,d)=>a+Math.abs(Number(d[1]||0)),0);
  const netDebt=Math.max(0,debtBorç-debtAlacak);
  const hasData=t.income>0 || t.expense>0 || debtBorç>0 || debtAlacak>0;
  let score=calculateFinancialScore(t), tone='Veri bekleniyor',toneClass='amber';
  if(score!==null){tone=score>=80?'Çok iyi gidiyorsun':score>=65?'İyi gidiyorsun':score>=50?'Dengeli':'Dikkatli olmalısın';toneClass=score>=65?'green':score>=50?'amber':'red';}
  else if(hasData){score=null;tone='Gelir verisi eksik';toneClass='amber';}
  const shopping=Math.max(0,Math.min(Math.round(Math.max(t.net,0)*0.08),3000));
  let advice='';
  if(!hasData) advice='Henüz yeterli finansal veri yok. Gelir, gider veya borç/alacak kayıtları eklediğinde öneriler kişiselleşecek.';
  else if(!t.income && t.expense>0) advice=`Bu ay ${money(t.expense)} gider kaydı var ancak gelir kaydı yok. Sağlıklı bir değerlendirme için gelirlerini de ekle.`;
  else if(t.net<0) advice=`Bu ay giderlerin gelirini ${money(Math.abs(t.net))} aştı. Zorunlu olmayan harcamaları azaltmak daha güvenli olabilir.`;
  else if(netDebt>Math.max(t.net,0) && netDebt>0) advice='Pozitif bakiyen var; ancak net borç yükün net bakiyenden yüksek. Öncelikle borç yükünü hafifletmek daha güvenli.';
  else if(debtAlacak>debtBorç && debtAlacak>0) advice='Alacakların borçlarından yüksek. Tahsilatlarını hızlandırman nakit akışını daha da güçlendirebilir.';
  else if(shopping>0) advice=`Pozitif nakit akışın nedeniyle bu ay ₺${shopping.toLocaleString('tr-TR')}’ye kadar kontrollü kişisel harcama bütçesi ayırabilirsin.`;
  else advice='Finansal hareketlerin dengeli görünüyor. Düzenli kayıt tutmaya devam et.';
  return {score,tone,toneClass,expenseRatio,netRatio,advice,shopping,hasData,netDebt};
}

function homeBalanceTrend(){
  const today=new Date();
  const iso=d=>{const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${day}`};
  const periodNet=(start,end)=>state.transactions.reduce((sum,t)=>{if(t[4]==='Transfer')return sum;const d=txDateValue(t);if(d<iso(start)||d>iso(end))return sum;return sum+(Number(t[1])||0)},0);
  const monthStart=new Date(today.getFullYear(),today.getMonth(),1);
  const prevMonthStart=new Date(today.getFullYear(),today.getMonth()-1,1);
  const prevMonthEnd=new Date(today.getFullYear(),today.getMonth(),0);
  const thisMonth=periodNet(monthStart,today), prevMonth=periodNet(prevMonthStart,prevMonthEnd);
  if(prevMonth!==0){
    const diff=thisMonth-prevMonth, pct=Math.round(Math.abs(diff)/Math.abs(prevMonth)*100);
    if(diff>0)return {icon:'↗',text:`Geçen aya göre %${pct} daha güçlü`,tone:'up'};
    if(diff<0)return {icon:'↘',text:`Geçen aya göre %${pct} geriledi`,tone:'down'};
    return {icon:'•',text:'Geçen aya göre dengeli',tone:'flat'};
  }
  const day=(today.getDay()+6)%7;
  const weekStart=new Date(today.getFullYear(),today.getMonth(),today.getDate()-day);
  const weekNet=periodNet(weekStart,today);
  if(weekNet>0)return {icon:'↗',text:`Bu hafta ${money(weekNet)} net arttı`,tone:'up'};
  if(weekNet<0)return {icon:'↘',text:`Bu hafta ${money(Math.abs(weekNet))} net geriledi`,tone:'down'};
  return {icon:'•',text:'Bu hafta dengeli seyrediyor',tone:'flat'};
}

  if(Number.isNaN(d.getTime())) return date;
  return d.toLocaleDateString('tr-TR',{day:'2-digit',month:'long'}).replace(/^0/,'');
}

function monthLabel(ym){const [y,m]=ym.split('-');return new Date(Number(y),Number(m)-1,1).toLocaleDateString('tr-TR',{month:'long'}).replace(/^./,c=>c.toUpperCase())}
function monthFilteredTransactions(){
  const ym=state.selectedMonth||'2026-08';
  return state.transactions.filter(t=>txDateValue(t).slice(0,7)===ym);
}
function txRangeList(){
  const base=state.transactions.slice();
  const now=new Date();
  const today=localDateISO();
  const day=(now.getDay()+6)%7;
  const weekStart=new Date(now.getFullYear(),now.getMonth(),now.getDate()-day);
  const weekStartISO=`${weekStart.getFullYear()}-${String(weekStart.getMonth()+1).padStart(2,'0')}-${String(weekStart.getDate()).padStart(2,'0')}`;
  if(state.txRange==='today') return base.filter(t=>txDateValue(t)===today);
  if(state.txRange==='week') return base.filter(t=>txDateValue(t)>=weekStartISO && txDateValue(t)<=today);
  if(state.txRange==='all') return base;
  return monthFilteredTransactions();
}
function txTypeMatches(t){
  const f=state.txTypeFilter||'Tümü';
  if(isDebtEventTx(t) && f!=='Tümü' && f!=='Borç/Alacak') return false;
  if(f==='Tümü') return true;
  if(f==='Borç/Alacak') return isDebtEventTx(t);
  if(f==='Transfer') return t[4]==='Transfer';
  if(f==='Gelir') return t[4]==='Gelir' || Number(t[1])>0 && t[4]!=='Transfer';
  if(f==='Gider') return t[4]==='Gider' || Number(t[1])<0;
  return true;
}
function filteredTransactions(){
  const q=(state.txSearch||'').toLocaleLowerCase('tr-TR').trim();
  return txRangeList().filter(t=>{
    const name=String(t[0]||'').toLocaleLowerCase('tr-TR');
    const kind=String(t[4]||'').toLocaleLowerCase('tr-TR');
    const d=txDateValue(t);
    const f=state.filters||{};
    return txTypeMatches(t) &&
      (!q||`${name} ${kind} ${String(t[7]||'')}`.includes(q)) &&
      (!f.from||d>=f.from) &&
      (!f.to||d<=f.to) &&
      (!f.category||f.category==='Tümü'||String(t[0]||'')===f.category);
  });
}
function txSummaryTotals(list){const x=financialSummary(list);return {income:x.income,expense:x.expense,transfers:x.transfers,financialCount:x.financialCount};}
function txMonthTotals(){
  const list=monthFilteredTransactions();
  const a=txSummaryTotals(list);
  return {...a,net:a.income-a.expense};
}
function txRangeLabel(){
  if(state.txRange==='today')return 'Bugün';
  if(state.txRange==='week')return 'Bu Hafta';
  if(state.txRange==='all')return 'Geçmiş';
  return 'Bu Ay';
}
function setTxTypeFilter(type){

}
function openTransactionAdd(){

function setTxRange(range){

}
function toggleTxDay(key){

}
function transactionDayCards(list){
  return groupTransactionsByDay(list).map(([d,items])=>{
    const totals=dayTotals(items);
    const transfers=items.filter(t=>t[4]==='Transfer').length;
    const net=totals.income-totals.expense;
    const expanded=!!state.txExpandedDays?.[d];
    const shown=expanded?items:items.slice(0,2);

      <button class="tx-day-summary" type="button" onclick="toggleTxDay('${d}')">

        <span class="tx-day-result ${net>=0?'green':'red'}">${net>=0?'+':'-'}${money(net)}</span>

      </button>

        <span><small>Gelir</small><b class="green">${money(totals.income)}</b></span>

      </div>
      <div class="tx-day-bar"><i class="income-bar" style="width:${totals.income+totals.expense?Math.min(100,totals.income/(totals.income+totals.expense)*100):0}%"></i><i class="expense-bar" style="width:${totals.income+totals.expense?Math.min(100,totals.expense/(totals.income+totals.expense)*100):0}%"></i></div>
      <div class="tx-day-items">${shown.map(tx).join('')}</div>
      ${!expanded&&more?`<button class="tx-more" onclick="toggleTxDay('${d}')">${more} işlemi daha göster <span>›</span></button>`:''}
      ${expanded?`<button class="tx-more subtle" onclick="toggleTxDay('${d}')">Günü kapat <span>⌃</span></button>`:''}
    </section>`;
  }).join('');
}
function openMonthPicker(){

}

  const rangeTabs=ranges.map(([k,label])=>`<button class="tx-range-tab ${state.txRange===k?'active':''}" onclick="setTxRange('${k}')">${label}</button>`).join('');
  return `<div class="tx-filter-state">${activeFilter?'Filtre aktif':''}</div>
    <div class="tx-type-tabs">${typeTabs}</div>

      <div class="tx-summary-cell"><small>Gelir</small><b class="green">${money(summary.income)}</b></div>
      <div class="tx-summary-cell"><small>Gider</small><b class="red">${money(summary.expense)}</b></div>
      <div class="tx-summary-cell"><small>Net</small><b class="${net>=0?'green':'red'}">${net<0?'-':''}${money(net)}</b></div>
    </div>
    <div class="tx-range-tabs">${rangeTabs}<button class="tx-calendar-btn" onclick="openMonthPicker()" aria-label="Ay seç">${iconSvg('calendar')}</button></div>
    ${search}
    <div id="txList" class="tx-history-wrap">
      <div class="tx-history-head"><div><b>${txRangeLabel()}</b><small>${state.txRange==='all'?'Tüm kayıtlar':`${monthLabel(state.selectedMonth)} 2026`}</small></div><span>${list.length}/${allBase.length} işlem</span></div>
      ${grouped}
      <button class="wide" onclick="openTransactionAdd()">＋ İşlem Ekle</button>
    </div>`;
}
function refreshTxList(){
  const input=document.getElementById('txSearch');
  const list=filteredTransactions();
  const box=document.getElementById('txList');
  if(!box)return;
  const grouped=list.length?transactionDayCards(list):'<div class="empty">Filtreye uygun işlem bulunamadı.</div>';
  box.innerHTML=`<div class="tx-history-head"><div><b>${txRangeLabel()}</b><small>${state.txRange==='all'?'Tüm kayıtlar':`${monthLabel(state.selectedMonth)} 2026`}</small></div><span>${list.length}/${txRangeList().length} işlem</span></div>${grouped}<button class="wide" onclick="openTransactionAdd()">＋ İşlem Ekle</button>`;
  if(input){const fresh=document.getElementById('txSearch');if(fresh){fresh.focus();fresh.setSelectionRange(fresh.value.length,fresh.value.length)}}
}
function filterTx(q){state.txSearch=q||'';refreshTxList()}
function openFilterModal(){const cats=[...new Set(state.transactions.map(t=>String(t[0]||'Diğer')))];const f=state.filters||{from:'',to:'',category:'Tümü'};document.getElementById('modal').classList.remove('hidden');document.getElementById('modal').innerHTML=`<div class="sheet filter-sheet"><button class="close" onclick="closeModal()">×</button><h2>Filtrele</h2><div class="filter-summary"><span>Seçili işlem</span><b>${filteredTransactions().length}</b></div><div class="form"><label>Tarih Aralığı</label><div class="filter-grid"><input id="filterFrom" type="date" value="${f.from||''}"><input id="filterTo" type="date" value="${f.to||''}"><label>Başlangıç</label><label>Bitiş</label></div><label>Kategori</label><select id="filterCategory"><option>Tümü</option>${cats.map(c=>`<option ${f.category===c?'selected':''}>${esc(c)}</option>`).join('')}</select></div><div class="filter-actions"><button class="filter-clear" onclick="clearFilters()">Temizle</button><button class="filter-apply" onclick="applyFilters()">Uygula</button></div></div>`}
function applyFilters(){state.filters={from:document.getElementById('filterFrom')?.value||'',to:document.getElementById('filterTo')?.value||'',category:document.getElementById('filterCategory')?.value||'Tümü'};closeModal();state.page='transactions';render();}
function clearFilters(){state.filters={from:'',to:'',category:'Tümü'};closeModal();state.page='transactions';render()}
function txIcon(name){const n=(name||'').toLocaleLowerCase('tr-TR');if(n.includes('yemek'))return '🍽️';if(n.includes('yakıt')||n.includes('yakit'))return '⛽';if(n.includes('alışveriş')||n.includes('alisveris')||n.includes('market'))return '🛒';if(n.includes('kahve'))return '☕';if(n.includes('kurye'))return '🛵';if(n.includes('fatura'))return '🧾';if(n.includes('kira'))return '🏠';return '₺'}
function tx(t){const isTransfer=t[4]==='Transfer',isDebt=isDebtEventTx(t);const val=isTransfer?Math.abs(Number(t[10])||0):Number(t[1]);const name=t[0]||'';const sub=isTransfer?`${t[8]||'Banka'} → ${t[9]||'Nakit'}`:isDebt?`${t[7]||'Banka'} · ${t[6]||txTimeLabel(t)}`:`${t[7]||'Banka'} · ${txTimeLabel(t)}`;return `<div class="txrow ${isDebt?'debt-event-row':''}" onclick="openTxDetail(${state.transactions.indexOf(t)})" data-search="${esc((name+' '+(t[4]||'')+' '+sub).toLocaleLowerCase('tr-TR'))}"><span class="avatar ${t[2]==='green'?'g':t[2]==='purple'?'p':isDebt?'debt-event-avatar':''}">${isDebt?(name==='Tahsilat Alındı'?'↙':name==='Borç Alındı'?'↗':'₺'):txIcon(name)}</span><div><div class="txname">${esc(name)}</div><div class="txtime">${esc(sub)}</div></div><div class="txval ${isTransfer?'':val>=0?'green':'red'}">${isTransfer?'⇄ ':val>=0?'+':'-'}${money(val)}</div></div>`}
function periodBounds(){
  const now=new Date();
  const todayEnd=new Date(now.getFullYear(),now.getMonth(),now.getDate(),23,59,59,999);
  let start=new Date(now.getFullYear(),now.getMonth(),1);
  if(state.reportPeriod==='week'){
    const day=(now.getDay()+6)%7;
    start=new Date(now.getFullYear(),now.getMonth(),now.getDate()-day);
  } else if(state.reportPeriod==='3m') start=new Date(now.getFullYear(),now.getMonth()-2,1);
  else if(state.reportPeriod==='all') start=new Date(2020,0,1);
  return {start,end:todayEnd};
}
function reportTransactions(){const b=periodBounds();return state.transactions.filter(t=>{const d=new Date(txDateValue(t)+'T12:00:00');return d>=b.start&&d<=b.end});}
function reportTrend(list){
  const buckets={};
  const weekKeys=[];
  const add=(key,t)=>{
    if(!buckets[key])buckets[key]={income:0,expense:0};
    const v=Number(t[1])||0;
    if(v>0)buckets[key].income+=v;
    else if(v<0)buckets[key].expense+=Math.abs(v);
  };
  const b=periodBounds();

  if(state.reportPeriod==='week'){
    // Bu Hafta: yalnızca Pazartesi → bugün aralığını üret; her gün tam olarak bir sütundur.
    list.forEach(t=>{if(!isTransferTx(t))add(txDateValue(t),t)});
    for(let d=new Date(b.start);d<=b.end;d.setDate(d.getDate()+1)){
      const k=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
      weekKeys.push(k);
      if(!buckets[k])buckets[k]={income:0,expense:0};
    }
  } else if(state.reportPeriod==='month'){
    // Bu Ay: 1'inden bugüne kadar günlük görünüm. Genel Bakış ile aynı dönemi
    // birebir temsil eder; transferler gelir/gider grafiğine girmez.
    list.forEach(t=>{if(!isTransferTx(t))add(txDateValue(t),t)});
    for(let d=new Date(b.start);d<=b.end;d.setDate(d.getDate()+1)){
      const k=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
      if(!buckets[k])buckets[k]={income:0,expense:0};
    }
  } else {
    // 3 Ay / Tümü: aylık görünüm. Tümü'nde mobil okunabilirlik için son 6 ay.
    list.forEach(t=>{if(!isTransferTx(t)){const d=txDateValue(t);add(d.slice(0,7),t)}});
    let months=[];
    const cursor=new Date(b.start.getFullYear(),b.start.getMonth(),1);
    const endMonth=new Date(b.end.getFullYear(),b.end.getMonth(),1);
    while(cursor<=endMonth){months.push(`${cursor.getFullYear()}-${String(cursor.getMonth()+1).padStart(2,'0')}`);cursor.setMonth(cursor.getMonth()+1)}
    if(state.reportPeriod==='all')months=months.slice(-6);
    months.forEach(k=>{if(!buckets[k])buckets[k]={income:0,expense:0};});
  }

  let keys=state.reportPeriod==='week' ? (weekKeys||[]) : Object.keys(buckets).sort();
  if(!keys.length)return '<div class="chart-empty">Bu dönem için grafik verisi yok.</div>';

  const max=Math.max(1,...keys.map(k=>Math.max(buckets[k]?.income||0,buckets[k]?.expense||0)));
  const labels=keys.map(k=>{
    if(k.length===7){
      const [y,m]=k.split('-');
      return new Date(+y,+m-1,1).toLocaleDateString('tr-TR',{month:'short'}).replace('.','');
    }
    const d=new Date(k+'T12:00:00');
    if(state.reportPeriod==='month')return `${d.getDate()} ${d.toLocaleDateString('tr-TR',{month:'short'}).replace('.','')}`;
    return `${d.getDate()} ${d.toLocaleDateString('tr-TR',{month:'short'}).replace('.','')}`;
  });

  return `<div class="trend-chart"><div class="trend-legend"><span><i class="income-dot"></i>Gelir</span><span><i class="expense-dot"></i>Gider</span><span class="trend-scale-note">Maks. ölçek: ${money(max)}</span></div><div class="trend-scroll"><div class="trend-bars trend-bars-${state.reportPeriod}" style="--trend-count:${keys.length}">${keys.map((k,i)=>{
    const a=buckets[k]||{income:0,expense:0};
    const ih=a.income?Math.max(3,Math.round(a.income/max*100)):0;
    const eh=a.expense?Math.max(3,Math.round(a.expense/max*100)):0;
    return `<div class="trend-col"><div class="trend-values"><span>${a.income?money(a.income):''}</span><span>${a.expense?money(a.expense):''}</span></div><div class="trend-track"><i class="trend-income" style="height:${ih}%"></i><i class="trend-expense" style="height:${eh}%"></i></div><small>${labels[i]}</small></div>`;
  }).join('')}</div></div></div>`;
}
function setReportPeriod(period){
  if(!['week','month','3m','all'].includes(period))return;
  state.reportPeriod=period;
  render();
}
function reports(){
  const list=reportTransactions();
  const summary=financialSummary(list);
  const income=summary.income, expense=summary.expense, net=summary.net;
  const total=income+expense;
  const cats={};
  list.filter(x=>Number(x[1])<0).forEach(x=>{const k=x[0]||'Diğer';cats[k]=(cats[k]||0)+Math.abs(Number(x[1]))});
  const sortedCats=Object.entries(cats).sort((a,b)=>b[1]-a[1]);
  const topCats=sortedCats.slice(0,5);
  const rest=sortedCats.slice(5).reduce((a,[,v])=>a+v,0);
  if(rest>0)topCats.push(['Diğer',rest]);
  const palette=['var(--gold)','var(--purple)','var(--cyan)','var(--green)','var(--red)','#a874ff'];
  const iconFor=(name)=>{
    const custom=[...(state.customCategories?.Gider||[])];
    const found=custom.find(x=>(typeof x==='string'?x:x?.name)===name);
    return found?(typeof found==='string'?categoryIcon(found,'Gider'):(found.icon||categoryIcon(found.name,'Gider'))):categoryIcon(name,'Gider');
  };
  const hasExpense=expense>0 && topCats.length>0;
  const expenseTotal=expense||1;
  let cursor=0;
  const stops=topCats.map(([name,val],i)=>{const pct=(val/expenseTotal)*100;const from=cursor;cursor+=pct;return `${palette[i%palette.length]} ${from.toFixed(2)}% ${cursor.toFixed(2)}%`;}).join(',');
  const bubbles=hasExpense?topCats.map(([name,val],i)=>{
    const pct=Math.round((val/expenseTotal)*100);
    return `<span class="donut-bubble b${i+1}" style="--bubble-color:${palette[i%palette.length]};--delay:${(i*.09)+.16}s" aria-label="${esc(name)} ${pct}%"><span class="bubble-icon">${iconFor(name)}</span><span class="bubble-pct">${pct}%</span></span>`;
  }).join(''):'';
  const reportDonut=hasExpense
    ? `<div class="donut" style="background:conic-gradient(${stops})"><div class="donut-center"><small>Gider</small><b>${money(expense)}</b></div></div><div class="donut-bubbles">${bubbles}</div>`
    : `<div class="donut-empty-state"><div class="donut-empty-ring"><div class="donut-center"><small>Gider yok</small><b>${money(0)}</b></div></div><span>Bu dönemde kayıtlı gider bulunmuyor.</span></div>`;
  const center=total.toLocaleString('tr-TR',{maximumFractionDigits:0});
  const b=periodBounds();
  const fmt=d=>d.toLocaleDateString('tr-TR',{day:'numeric',month:'long',year:'numeric'});
  const labels={week:`${fmt(b.start)} - ${fmt(b.end)}`,month:`${fmt(b.start)} - ${fmt(b.end)}`,'3m':`${fmt(b.start)} - ${fmt(b.end)}`,all:`${fmt(b.start)} - ${fmt(b.end)}`};
  const catIcons={Yemek:'🍴',Yakıt:'⛽',Alışveriş:'🛒',Market:'🛒',Kahve:'☕',Diğer:'◉'};
  const catRows=Object.entries(cats).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([name,val],idx)=>{
    const pct=expense?Math.round(val/expense*100):0;
    return `<div class="barrow"><span class="catlabel"><span class="caticon c${idx}">${catIcons[name]||iconFor(name)}</span>${esc(name)}</span><div class="bar"><i style="width:${pct}%"></i></div><span>${money(val)}　${pct}%</span></div>`;
  }).join('')||'<div class="empty">Henüz gider verisi yok.</div>';
  return `<div class="periods">${[['week','Bu Hafta'],['month','Bu Ay'],['3m','3 Ay'],['all','Tümü']].map(([v,l])=>`<button class="${state.reportPeriod===v?'active':''}" onclick="setReportPeriod('${v}')">${l}</button>`).join('')}</div><section class="card report"><b>Genel Bakış</b><div class="muted" style="font-size:8px;margin:5px 0 13px">${labels[state.reportPeriod]}</div><div class="donutrow"><div class="donut-stage">${reportDonut}</div><div class="legend"><span>🟢 Gelir<b>${money(income)}</b></span><span>🔴 Gider<b class="red">${money(expense)}</b></span><span>🟣 Net<b>${money(net)}</b></span></div></div></section><section class="card report"><div class="list-head"><b>Grafik</b><span class="muted" style="font-size:8px">Gelir / Gider</span></div>${reportTrend(list)}</section><section class="card report"><div class="list-head"><b>Kategori Dağılımı</b><button class="detail" onclick="openExpenseDetails()">Detaylar ›</button></div>${catRows}</section>`;
}

function openExpenseDetails(){
  const list=reportTransactions();
  const cats={};
  list.filter(x=>Number(x[1])<0).forEach(x=>{const k=x[0]||'Diğer';cats[k]=(cats[k]||0)+Math.abs(Number(x[1]));});
  const total=Object.values(cats).reduce((a,v)=>a+v,0);
  const iconFor=(name)=>{
    const custom=[...(state.customCategories?.Gider||[])];
    const found=custom.find(x=>(typeof x==='string'?x:x?.name)===name);
    return found?(typeof found==='string'?categoryIcon(found,'Gider'):(found.icon||categoryIcon(found.name,'Gider'))):categoryIcon(name,'Gider');
  };

function smartDateISO(v){const m=String(v||'').match(/^(\d{4}-\d{2}-\d{2})/);return m?m[1]:''}
function smartMonthBounds(offset=0){const n=new Date(),d=new Date(n.getFullYear(),n.getMonth()+offset,1),key=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`,last=new Date(d.getFullYear(),d.getMonth()+1,0),endDate=offset===0?new Date(Math.min(last.getTime(),new Date(n.getFullYear(),n.getMonth(),n.getDate()).getTime())):last;return {start:key+'-01',end:key+'-'+String(endDate.getDate()).padStart(2,'0')}}
function smartPeriodBounds(period=state.smartPeriod){
  const now=new Date(); now.setHours(0,0,0,0);
  const dayMs=86400000;
  const iso=d=>{const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${day}`};
  let start=new Date(now), end=new Date(now), previousStart=null, previousEnd=null;
  if(period==='today'){
    previousStart=new Date(now.getTime()-dayMs); previousEnd=new Date(now.getTime()-dayMs);
  }else if(period==='week'){
    const monday=new Date(now); monday.setDate(now.getDate()-((now.getDay()+6)%7)); start=monday;
    previousEnd=new Date(start.getTime()-dayMs); previousStart=new Date(previousEnd.getTime()-6*dayMs);
  }else if(period==='month'){
    start=new Date(now.getFullYear(),now.getMonth(),1);
    previousStart=new Date(now.getFullYear(),now.getMonth()-1,1); previousEnd=new Date(now.getFullYear(),now.getMonth(),0);
  }else if(period==='prevMonth'){
    start=new Date(now.getFullYear(),now.getMonth()-1,1); end=new Date(now.getFullYear(),now.getMonth(),0);
    previousStart=new Date(now.getFullYear(),now.getMonth()-2,1); previousEnd=new Date(now.getFullYear(),now.getMonth()-1,0);
  }else if(period==='3m'){
    start=new Date(now.getFullYear(),now.getMonth()-2,1);
    previousEnd=new Date(start.getTime()-dayMs); previousStart=new Date(now.getFullYear(),now.getMonth()-5,1);
  }else if(period==='all'){
    const dates=(state.transactions||[]).map(t=>smartDateISO(t[6])).filter(Boolean).sort();
    if(dates.length)start=new Date(dates[0]+'T00:00:00');
    previousStart=null; previousEnd=null;
  }else period='month';
  return {period,start,end,previousStart,previousEnd,startISO:iso(start),endISO:iso(end),previousStartISO:previousStart?iso(previousStart):'',previousEndISO:previousEnd?iso(previousEnd):''};
}
function smartTransactionsForPeriod(period=state.smartPeriod){
  const b=smartPeriodBounds(period);
  return state.transactions.filter(t=>{const d=smartDateISO(t[6]);return d && d>=b.startISO && d<=b.endISO});
}
function smartPeriodSummary(period=state.smartPeriod){
  const b=smartPeriodBounds(period), current=smartTransactionsForPeriod(period);
  const previous=b.previousStartISO?state.transactions.filter(t=>{const d=smartDateISO(t[6]);return d && d>=b.previousStartISO && d<=b.previousEndISO}):[];
  return {bounds:b,current,summary:financialSummary(current),previous,previousSummary:financialSummary(previous)};
}
function smartDelta(curr,prev){
  if(!prev)return null;
  if(prev===0)return curr===0?0:null;
  return Math.round((curr-prev)/Math.abs(prev)*100);
}
function smartDeltaText(v){
  if(v===null)return 'Karşılaştırma yok';
  if(v===0)return 'Değişmedi';
  return `${v>0?'↑':'↓'} %${Math.abs(v)}`;
}
function smartTrendData(period=state.smartPeriod){
  const b=smartPeriodBounds(period), list=smartTransactionsForPeriod(period), buckets={};
  const add=(key,label)=>{if(!buckets[key])buckets[key]={label,income:0,expense:0};return buckets[key]};
  list.forEach(t=>{
    if(isTransferTx(t))return;
    const d=smartDateISO(t[6]); if(!d)return;
    const dt=new Date(d+'T00:00:00'); let key,label;
    if(period==='today'||period==='week'){
      key=d; label=period==='today'?(t[3]||'Bugün').slice(0,5):dt.toLocaleDateString('tr-TR',{weekday:'short'}).replace('.','');
    }else if(period==='month'||period==='prevMonth'){
      const bucket=Math.floor((dt.getDate()-1)/7)+1; key=`${dt.getFullYear()}-${dt.getMonth()+1}-w${bucket}`; label=`H${bucket}`;
    }else{
      key=`${dt.getFullYear()}-${dt.getMonth()+1}`; label=dt.toLocaleDateString('tr-TR',{month:'short'}).replace('.','');
    }
    const x=add(key,label),v=Number(t[1])||0;if(v>0)x.income+=v;else if(v<0)x.expense+=Math.abs(v);
  });
  return Object.entries(buckets).sort((a,b)=>a[0].localeCompare(b[0])).map(([,v])=>v);
}

function smartFinancialGoals(){

  const card=(g,i)=>{
    const target=Math.max(0,Number(g.target)||0), saved=Math.max(0,Number(g.saved)||0);
    const pct=target?Math.min(100,Math.round(saved/target*100)):0, remain=Math.max(0,target-saved);
    const actual=availableBalance();
    const ratio=actual>0?Math.round(saved/actual*100):null;
    const targetDate=g.date?formatDateTR(g.date):'Tarih belirtilmedi';

      <div class="smart-goal-head"><div class="smart-goal-icon">${escGoal(g.icon||'🎯')}</div><div class="smart-goal-title"><b>${escGoal(g.name||'Finansal Hedef')}</b><small>${targetDate}</small></div><div class="smart-goal-actions"><button type="button" onclick="openGoalModal(${i})" aria-label="Hedefi düzenle">✎</button><button type="button" onclick="deleteGoal(${i})" aria-label="Hedefi sil">×</button></div></div>
      <div class="smart-goal-values"><span>Hedef <b>${money(target)}</b></span><span>Birikim <b>${money(saved)}</b></span><span>Kalan <b>${money(remain)}</b></span></div>
      <div class="smart-goal-progress"><i class="${toneFor(pct)}" style="width:${pct}%"></i></div>
      <div class="smart-goal-meta"><span>%${pct} tamamlandı</span><span>${ratio===null?'Gerçek bakiye ile karıştırılmaz':`Gerçek net bakiyenin %${Math.min(100,Math.max(0,ratio))}'i`}</span></div>
    </div>`;
  };
  const actual=financialSummary(state.transactions).net;
  const totalTarget=goals.reduce((a,g)=>a+Math.max(0,Number(g.target)||0),0);
  const totalSaved=goals.reduce((a,g)=>a+Math.max(0,Number(g.saved)||0),0);
  const totalRemaining=Math.max(0,totalTarget-totalSaved);
  const overallPct=totalTarget?Math.min(100,Math.round(totalSaved/totalTarget*100)):0;
  const smartText=!goals.length
    ? 'İlk finansal hedefini eklediğinde hedef tutarı, birikimin ve kalan miktarın burada ayrı olarak takip edilecek.'
    : actual<0

      : overallPct>=100
        ? 'Tanımlı hedeflerinin toplam birikim tutarı tamamlandı. Yeni hedefler ekleyebilir veya mevcut hedeflerini güncelleyebilirsin.'
        : `Toplam hedeflerinin %${overallPct}'i tamamlandı. Kalan ${money(totalRemaining)} için düzenli ve sürdürülebilir birikim planı daha sağlıklı olur.`;
  return `<section class="card smart-card smart-goal-card">

    <div class="smart-goal-summary"><div><small>Toplam Hedef</small><b>${goals.length?money(totalTarget):'—'}</b></div><div><small>Hedef Birikimi</small><b>${goals.length?money(totalSaved):'—'}</b></div><div><small>Gerçek Net Bakiye</small><b class="${actual>=0?'green':'red'}">${money(actual)}</b></div></div>
    <div class="smart-goal-overall"><div><span>Genel hedef ilerlemesi</span><b>${goals.length?`%${overallPct}`:'—'}</b></div><i><em style="width:${overallPct}%"></em></i></div>
    ${goals.length?`<div class="smart-goal-list">${goals.map(card).join('')}</div>`:`<button type="button" class="smart-goal-empty" onclick="openGoalModal()"><b>İlk hedefini oluştur</b><span>Örn. acil durum fonu, motor, tatil veya eğitim hedefi</span><em>+ Hedef Ekle</em></button>`}
    <div class="smart-goal-insight"><b>Akıllı değerlendirme</b><span>${esc(smartText)}</span></div>

function parseSmartMoney(v){return Number(String(v||'0').replace(/[^0-9,.-]/g,'').replace(/\.(?=\d{3}(?:,|$))/g,'').replace(',','.'))||0}
function saveGoal(index=null){

function smartUpcomingPayments(){
  const today=localDateISO();
  const list=(state.upcoming||[]).filter(x=>x.kind==='payment'&&smartDateISO(x.date));
  const future=list.filter(x=>smartDateISO(x.date)>=today).sort((a,b)=>smartDateISO(a.date).localeCompare(smartDateISO(b.date)));
  const overdue=list.filter(x=>smartDateISO(x.date)<today).sort((a,b)=>smartDateISO(b.date).localeCompare(smartDateISO(a.date)));
  const priority=[...overdue,...future];
  const next7=future.filter(x=>{const d=new Date(smartDateISO(x.date)+'T00:00:00');const n=new Date(today+'T00:00:00');return (d-n)/86400000<=7});
  const total=next7.reduce((a,x)=>a+(Number(x.amount)||0),0);
  const next=priority[0]||null;
  const rows=priority.slice(0,3).map(x=>{
    const d=smartDateISO(x.date), diff=Math.round((new Date(d+'T00:00:00')-new Date(today+'T00:00:00'))/86400000);
    const status=d<today?'Gecikmiş':diff===0?'Bugün':diff===1?'Yarın':diff<=7?`${diff} gün kaldı`:d;
    const cls=d<today?'overdue':diff===0?'today':'';
    return `<div class="smart-upcoming-item"><span class="smart-upcoming-icon">${iconSvg('calendar')}</span><div><b>${esc(x.title||'Yaklaşan ödeme')}</b><small>${esc(d)}${x.note?' · '+esc(x.note):''}</small><span class="smart-upcoming-badge ${cls}">${status}</span></div><strong class="${d<today?'red':''}">${money(Number(x.amount)||0)}</strong></div>`;
  }).join('');
  if(!priority.length)return `<section class="card smart-card"><div class="smart-section-title"><b>Yaklaşan Ödemeler</b><button class="detail" onclick="showUpcoming()">Ekle ›</button></div><div class="smart-advice"><span class="smart-advice-icon">${iconSvg('calendar')}</span><div><b>Planlanmış yaklaşan ödeme bulunmuyor.</b><small>Bir ödeme eklediğinde vade tarihi, önceliği ve tutarı burada otomatik takip edilecek.</small></div></div></section>`;
  return `<section class="card smart-card"><div class="smart-section-title"><b>Yaklaşan Ödemeler</b><button class="detail" onclick="showUpcoming()">Tümü ›</button></div><div class="smart-advice"><span class="smart-advice-icon">${iconSvg('bell')}</span><div><b>${next&&smartDateISO(next.date)<today?'Öncelikli ödeme gecikmiş durumda.':next&&smartDateISO(next.date)===today?'Bugün vadesi gelen bir ödeme var.':'Yaklaşan ödemelerini önceden planla.'}</b><small>${next7.length?`Önümüzdeki 7 günde ${next7.length} ödeme · ${money(total)}`:'Önümüzdeki 7 günde kayıtlı ödeme yok.'}</small></div></div><div class="smart-upcoming-list">${rows}</div><div class="smart-upcoming-total"><span>Toplam yaklaşan ödeme</span><b>${money(future.reduce((a,x)=>a+(Number(x.amount)||0),0))}</b></div></section>`;
}


function smartRecurringExpenses(returnData=false){
  /* 13.3.93 — Abonelik / Düzenli Giderler: iki güvenli kaynak.
     1) Gerçek işlem geçmişindeki tekrar eden desenler otomatik analiz edilir.
     2) Kullanıcının ayrıca kaydettiği abonelik/düzenli gider kayıtları ayrı tutulur.
     Hiçbiri gerçek bakiyeyi tek başına değiştirmez. */
  const tx=Array.isArray(state.transactions)?state.transactions:[];
  const groups={};
  tx.forEach(t=>{
    if(isTransferTx(t))return;
    if(String(t[4]||'')!=='Gider')return;
    const amount=Math.abs(Number(t[1])||0); if(amount<=0)return;
    const date=String(t[6]||'').slice(0,10); if(!/^\d{4}-\d{2}-\d{2}$/.test(date))return;
    const category=String(t[0]||'Diğer').trim()||'Diğer';
    const note=String(t[5]||'').trim();
    const key=(category+'|'+note.toLocaleLowerCase('tr-TR')).trim();
    (groups[key]||(groups[key]={category,note,items:[]})).items.push({amount,date});
  });
  const candidates=[];
  Object.values(groups).forEach(g=>{
    if(g.items.length<3)return;
    const months=new Set(g.items.map(x=>x.date.slice(0,7))); if(months.size<3)return;
    const amounts=g.items.map(x=>x.amount).sort((a,b)=>a-b);
    const median=amounts[Math.floor(amounts.length/2)]||0; if(!median)return;
    const close=g.items.filter(x=>Math.abs(x.amount-median)/median<=0.20).length; if(close<3)return;
    const last=g.items.slice().sort((a,b)=>b.date.localeCompare(a.date))[0];
    const monthlyAvg=g.items.reduce((a,x)=>a+x.amount,0)/months.size;
    const confidence=Math.min(99,Math.round(55+months.size*8+Math.min(20,close*3)));
    candidates.push({category:g.category,note:g.note||g.category,monthlyAvg,last,months:months.size,confidence,source:'Otomatik'});
  });
  const manual=(Array.isArray(state.recurring)?state.recurring:[]).filter(x=>(x.type!=='Düzenli Gelir')&&(Number(x.amount)||0)>0&&x.active!==false);
  manual.forEach(x=>{
    const freq=x.frequency||'Aylık';
    const monthlyFactor=freq==='Haftalık'?52/12:freq==='3 Aylık'?1/3:freq==='Yıllık'?1/12:1;
    candidates.push({category:x.category||'Düzenli gider',note:x.title||'Abonelik',monthlyAvg:(Number(x.amount)||0)*monthlyFactor,last:{date:x.nextDate||''},months:1,confidence:100,source:'Kayıtlı',frequency:freq,id:x.id});
  });
  candidates.sort((a,b)=>b.monthlyAvg-a.monthlyAvg);
  const top=candidates.slice(0,5);
  const visibleRecurring=top.slice(0,2);
  const hiddenRecurringCount=Math.max(0,top.length-visibleRecurring.length);
  const monthly=top.reduce((a,x)=>a+x.monthlyAvg,0);
  const allIncome=financialSummary(tx).income||0;
  const risk=allIncome>0?Math.round(monthly/allIncome*100):0;
  const insight=top.length
    ? `Bu alan iki kaynaktan beslenir: gerçek Gider işlem geçmişindeki tekrarlar ve senin ayrıca kaydettiğin abonelik/düzenli giderler. Kayıtlı kalemler gerçek bakiyeye otomatik eklenmez.`
    : 'Henüz kayıtlı abonelik yok ve işlem geçmişinde yeterli tekrar paterni bulunmadı. “Abonelik / Düzenli Gider Ekle” ile kalemi kendin kaydedebilir veya aynı giderin birkaç ay tekrar etmesini bekleyebilirsin.';
  const rows=visibleRecurring.map(x=>{const action=x.source==='Kayıtlı'&&x.id?` onclick="openRecurringModal('${String(x.id).replace(/'/g,"\\'")}')" role="button" tabindex="0"`:'';return `<div class="smart-recurring-row${x.source==='Kayıtlı'?' is-manual':''}"${action}><span class="smart-recurring-icon">${x.source==='Kayıtlı'?'▣':'↻'}</span><div><b>${esc(x.note||x.category)}</b><small>${esc(x.category)} · ${x.source}${x.source==='Kayıtlı'?` · ${esc(x.frequency||'Aylık')}`:` · ${x.months} tekrar · %${x.confidence} güven`}</small></div><strong>${money(x.monthlyAvg)}<small>/ ay</small></strong></div>`}).join('');
  if(returnData) return {top,monthly,risk,insight,allIncome};
  return '';
}


function smartRecurringIncome(){
  /* 13.3.102 — Düzenli Gelir: gün sabit, tutar değişken olabilir.
     Planlanan gelir gerçek bakiyeye hiçbir şekilde eklenmez. Kullanıcı
     ödeme gerçekten geldiğinde "Gelir Olarak Ekle" ile normal Gelir işlemine çevirir. */
  const list=(Array.isArray(state.recurring)?state.recurring:[]).filter(x=>x.type==='Düzenli Gelir'&&x.active!==false);
  const today=localDateISO();
  const rows=list.slice().sort((a,b)=>String(a.nextDate||'').localeCompare(String(b.nextDate||''))).slice(0,2).map(x=>{
    const d=String(x.nextDate||'').slice(0,10);
    const weekday=d?new Date(d+'T12:00:00').toLocaleDateString('tr-TR',{weekday:'long'}):'Ödeme günü';
    const amount=(Number(x.amount)||0)>0?money(Number(x.amount)):'Tutar bekleniyor';
    const source=String(x.title||'Düzenli gelir');
    return `<div class="smart-income-row"><span class="smart-income-icon">${iconSvg('calendar')}</span><div><b>${esc(source)}</b><small>${esc(weekday)} · ${esc(x.frequency||'Haftalık')} · ${d?esc(formatDateTR(d)):'Tarih bekleniyor'}</small></div><strong class="green">${esc(amount)}</strong><button type="button" class="smart-income-add" onclick="openRecurringIncomeEntry('${String(x.id).replace(/'/g,"\\'")}')">Gelir Olarak Ekle <span>→</span></button></div>`;
  }).join('');
  const next=list.slice().sort((a,b)=>String(a.nextDate||'').localeCompare(String(b.nextDate||'')))[0]||null;

function smartAbnormalMovements(current, previous){
  /* 13.3.84 — #12 Olağandışı Hareketler.
     Yalnızca analiz eder; işlemleri, bakiyeyi ve skoru değiştirmez. */
  const all=Array.isArray(state.transactions)?state.transactions:[];
  const expense=t=>t && t[4]!=='Transfer' && (Number(t[1])||0)<0;
  const amount=t=>Math.abs(Number(t[1])||0);
  const category=t=>String(t?.[0]||'Diğer').trim()||'Diğer';
  const history={};
  all.forEach(t=>{
    if(!expense(t))return;
    const a=amount(t); if(a<=0)return;
    const k=category(t); (history[k]||(history[k]=[])).push(a);
  });
  const median=arr=>{const a=arr.slice().sort((x,y)=>x-y);if(!a.length)return 0;const m=Math.floor(a.length/2);return a.length%2?a[m]:(a[m-1]+a[m])/2};
  const anomalies=[];
  current.filter(expense).forEach(t=>{
    const a=amount(t), k=category(t), h=(history[k]||[]).slice();
    if(h.length<4 || a<=0)return;
    const idx=h.findIndex(v=>v===a); if(idx>=0)h.splice(idx,1);
    if(h.length<3)return;
    const med=median(h); if(!med)return;
    const deviations=h.map(v=>Math.abs(v-med));
    const mad=median(deviations);
    const threshold=Math.max(med*1.8, med+Math.max(mad*3, med*.25));
    if(a>=threshold){
      const ratio=a/med;
      anomalies.push({t,a,k,med,ratio,score:ratio+(mad?Math.min(1,(a-med)/(mad*4)):0)});
    }
  });
  const catCurrent={};
  current.filter(expense).forEach(t=>{const k=category(t);catCurrent[k]=(catCurrent[k]||0)+amount(t)});
  const catPrevious={};
  previous.filter(expense).forEach(t=>{const k=category(t);catPrevious[k]=(catPrevious[k]||0)+amount(t)});
  Object.keys(catCurrent).forEach(k=>{
    const prev=catPrevious[k]||0, cur=catCurrent[k];
    if(prev>0 && cur>=prev*1.35 && cur-prev>=Math.max(250,prev*.15)){
      anomalies.push({kind:'trend',k,a:cur,prev,ratio:cur/prev,score:cur/prev});
    }
  });
  anomalies.sort((a,b)=>b.score-a.score);
  const unique=[]; const seen=new Set();
  anomalies.forEach(x=>{const key=x.kind==='trend'?'trend:'+x.k:'tx:'+state.transactions.indexOf(x.t);if(!seen.has(key)){seen.add(key);unique.push(x)}});
  const top=unique.slice(0,3);
  if(!top.length){
    return `<section class="card smart-card smart-abnormal-card"><div class="smart-section-title"><b>Olağandışı Hareketler</b><span>Davranış analizi</span></div><div class="smart-advice"><span class="smart-advice-icon">✓</span><div><b>Belirgin bir olağandışı hareket bulunmadı.</b><small>Sistem geçmiş harcama desenlerini karşılaştırıyor. Yeterli geçmiş veri oluştuğunda belirgin sapmalar burada gösterilecek.</small></div></div></section>`;
  }
  const rows=top.map(x=>{
    if(x.kind==='trend'){
      const pct=Math.round((x.ratio-1)*100);
      return `<div class="smart-abnormal-row"><span class="smart-abnormal-icon">↗</span><div><b>${esc(x.k)}</b><small>${esc(smartPeriodLabel(state.smartPeriod))} toplamı önceki döneme göre %${pct} daha yüksek.</small></div><strong class="red">${money(x.a)}</strong></div>`;
    }
    const pct=Math.round((x.ratio-1)*100);
    const date=txDateValue(x.t);
    return `<div class="smart-abnormal-row"><span class="smart-abnormal-icon">⚠</span><div><b>${esc(x.k)}</b><small>${esc(date)} · geçmiş medyanın yaklaşık %${pct} üzerinde.</small></div><strong class="red">${money(x.a)}</strong></div>`;
  }).join('');
  return `<section class="card smart-card smart-abnormal-card"><div class="smart-section-title"><b>Olağandışı Hareketler</b><span>${top.length} uyarı</span></div><div class="smart-abnormal-note"><span class="smart-abnormal-note-icon">⚠</span><div><b>Normal harcama davranışından sapmalar</b><small>Uyarılar yalnızca gözlem amaçlıdır; işlemlerine, gerçek bakiyene veya Finans Sağlık Skoruna otomatik müdahale edilmez.</small></div></div><div class="smart-abnormal-list">${rows}</div></section>`;
}

function smartRecommendations(current, previous){
  /* 13.3.85 — #13 Akıllı Öneriler Motoru.
     Yalnızca mevcut analizlerden öneri üretir; hiçbir kaydı, bakiyeyi veya skoru değiştirmez. */
  const analysis=smartPeriodSummary(state.smartPeriod), t=analysis.summary, prev=analysis.previousSummary;
  const suggestions=[];
  const add=(type,title,text,reason,action)=>suggestions.push({type,title,text,reason,action});
  const expenseRatio=t.income?Math.round(t.expense/t.income*100):0;
  const savingsRate=t.income?Math.round(t.net/t.income*100):0;
  const cats={}; current.forEach(x=>{const v=Number(x[1])||0;if(v<0&&x[4]!=='Transfer'){const k=String(x[0]||'Diğer').trim()||'Diğer';cats[k]=(cats[k]||0)+Math.abs(v)}});
  const topCat=Object.entries(cats).sort((a,b)=>b[1]-a[1])[0]||null;
  const budgetTarget=t.income?Math.round(t.income*.8):0;
  const budgetRemaining=budgetTarget?budgetTarget-t.expense:null;
  const upcoming=(state.upcoming||[]).filter(x=>x.kind==='payment'&&smartDateISO(x.date)>=localDateISO());
  const next7=upcoming.filter(x=>{const d=new Date(smartDateISO(x.date)+'T00:00:00');const now=new Date(localDateISO()+'T00:00:00');return Math.round((d-now)/86400000)<=7});
  const recurring=Array.isArray(state.transactions)?state.transactions:[];
  const abnormal=smartAbnormalMovements(current,previous).includes('smart-abnormal-row');
  if(!t.income&&!t.expense){
    add('info','İlk finansal kayıtlarını ekle','Gelir ve giderlerini düzenli kaydetmeye başla.','Bu dönemde analiz için yeterli finansal hareket yok.','İşlem Ekle');
  } else {
    if(expenseRatio>=85){
      add('warning','Giderlerini yakından takip et',`Giderlerin gelirin %${expenseRatio}'ine ulaştı.`,`Gider oranı yüksek ve bütçe alanın daralıyor.`,'Giderleri İncele');
    } else if(budgetRemaining!==null && budgetRemaining>0 && topCat){
      add('tip',`${topCat[0]} harcamasını kontrol et`,`${money(topCat[1])} ile bu dönemin en yüksek gider kalemi.`,`En yüksek gider kategorisi toplam harcamada öne çıkıyor.`,'Harcama Dağılımı');
    }
    if(savingsRate<0){
      add('warning','Önce net durumu dengele',`Bu dönemde ${money(Math.abs(t.net))} negatif net oluştu.`,'Giderler gelirlerin üzerinde olduğu için tasarruf alanı oluşmuyor.','Gelir–Gider Analizi');
    } else if(savingsRate<10 && t.income>0){
      add('tip','Küçük bir tasarruf payı oluştur',`Mevcut net oran yaklaşık %${savingsRate}.`,'Gelirin küçük bir bölümü dönem sonunda kalıyor.','Bütçeyi İncele');
    }
    if(next7.length){
      const total=next7.reduce((a,x)=>a+(Number(x.amount)||0),0);
      add('calendar','Yaklaşan ödemeleri önceliklendir',`Önümüzdeki 7 günde ${next7.length} ödeme · ${money(total)}.`,`Yakın vadeli ödemeler nakit planlamasını etkileyebilir.`,'Ödemeleri Gör');
    }
    if(prev.expense>0&&t.expense>=prev.expense*1.2){
      add('trend','Gider artışını incele',`Giderlerin önceki döneme göre yaklaşık %${Math.round((t.expense/prev.expense-1)*100)} arttı.`,'Dönemsel gider artışı olağandışı harcama riskini yükseltebilir.','Dönem Analizi');
    }
    if(abnormal){
      add('alert','Olağandışı hareketleri kontrol et','Normal harcama davranışından sapma tespit edildi.','Bazı giderler geçmiş harcama deseninden belirgin şekilde ayrılıyor.','Olağandışı Hareketler');
    }
  }
  /* Tekrarlayan giderlerin varlığını yalnızca bilgi amaçlı işaretle; kayıtları değiştirme. */
  const recurringCount=(current.length&&recurring.length)?Object.keys((()=>{const g={};recurring.forEach(x=>{const v=Number(x[1])||0;if(v<0&&x[4]!=='Transfer'){const k=String(x[0]||'Diğer')+'|'+String(x[5]||'');(g[k]||(g[k]=[])).push(x)}});return g})()).length:0;
  if(recurringCount>=2 && suggestions.length<5){
    add('repeat','Düzenli giderlerini gözden geçir','Tekrarlayan gider desenlerin var.','Düzenli giderler zaman içinde bütçe üzerinde sürekli yük oluşturabilir.','Düzenli Giderler');
  }
  const seen=new Set(), top=suggestions.filter(x=>{const k=x.title;if(seen.has(k))return false;seen.add(k);return true}).slice(0,4);
  if(!top.length) top.push({type:'ok',title:'Finansal düzenini koru',text:'Kayıtlarını düzenli tutmaya devam et.',reason:'Mevcut veriler için öncelikli bir uyarı oluşmadı.',action:'Genel Durum'});
  const iconMap={warning:'⚠',tip:'✦',calendar:'◷',trend:'↗',alert:'!',repeat:'↻',info:'i',ok:'✓'};
  const rows=top.map(x=>`<div class="smart-recommendation-row"><span class="smart-recommendation-icon ${esc(x.type)}">${iconMap[x.type]||'✦'}</span><div><b>${esc(x.title)}</b><small>${esc(x.text)}</small></div><button type="button" onclick="smartRecommendationAction('${esc(x.action)}')">${x.action==='İşlem Ekle'?'Ekle':'İncele ›'}</button></div>`).join('');
  return `<section class="card smart-card smart-recommendations-card"><div class="smart-section-title"><b>Akıllı Öneriler</b><span>${top.length} öncelik</span></div><div class="smart-recommendation-note"><span class="smart-recommendation-note-icon">✦</span><div><b>Finansal verilerine göre</b><small>Öneriler yalnızca mevcut kayıtlarını analiz eder; hiçbir işlemi veya bakiyeyi otomatik değiştirmez.</small></div></div><div class="smart-recommendation-list">${rows}</div></section>`;
}
function smartRecommendationAction(action){
  const a=String(action||'');
  if(a==='İşlem Ekle'){openTransactionAdd();return}
  if(a==='Ödemeleri Gör'){showUpcoming();return}
  if(a==='Harcama Dağılımı'){state.page='reports';state.reportPeriod='month';render();return}
  if(a==='Giderleri İncele'){state.page='transactions';state.txRange='month';render();return}
  if(a==='Dönem Analizi'||a==='Gelir–Gider Analizi'||a==='Bütçeyi İncele'){state.page='smart';render();return}
  if(a==='Düzenli Giderler'||a==='Olağandışı Hareketler'){state.page='smart';render();return}
  state.page='smart';render();
}

function smartProactiveSystem(current, previous){
  /* 13.3.87 — #16 Proaktif Akıllı Sistem.
     Yalnızca mevcut verilerdeki yeni/önemli durumları gösterir; hiçbir kaydı değiştirmez. */
  const a=smartPeriodSummary(state.smartPeriod), t=a.summary, p=a.previousSummary;
  const items=[];
  const add=(tone,title,text)=>items.push({tone,title,text});
  const ratio=t.income?Math.round(t.expense/t.income*100):0;
  const savings=t.income?Math.round(t.net/t.income*100):0;
  if(p.expense>0 && t.expense>=p.expense*1.2) add('red','Giderlerde belirgin artış',`Giderler önceki döneme göre yaklaşık %${Math.round((t.expense/p.expense-1)*100)} arttı.`);
  if(ratio>=85) add('amber','Gider yükü yükseldi',`Giderlerin gelirin %${ratio}'ine ulaştı; bütçe alanı daralıyor.`);
  const today=localDateISO();
  const next=(state.upcoming||[]).filter(x=>x.kind==='payment'&&smartDateISO(x.date)>=today);
  const next7=next.filter(x=>{const d=new Date(smartDateISO(x.date)+'T00:00:00');const n=new Date(today+'T00:00:00');return Math.round((d-n)/86400000)<=7;});
  if(next7.length){const total=next7.reduce((sum,x)=>sum+(Number(x.amount)||0),0);add('purple','Yaklaşan ödeme yükü',`Önümüzdeki 7 günde ${next7.length} ödeme ve toplam ${money(total)} planlı.`);}
  if(t.net<0) add('red','Net durum negatif',`Bu dönemde gelirlerin giderleri ${money(Math.abs(t.net))} tutarında karşılamıyor.`);
  if(savings>=0 && savings<10 && t.income>0) add('amber','Tasarruf alanı daraldı',`Bu dönemde gelirden kalan oran yaklaşık %${savings}.`);
  const abnormal=smartAbnormalMovements(current,previous).includes('smart-abnormal-row');
  if(abnormal) add('amber','Olağandışı hareket bulundu','Geçmiş harcama davranışından belirgin şekilde ayrılan bir gider tespit edildi.');
  const recurring=smartRecurringExpenses(true).top.length>0;
  if(recurring) add('blue','Düzenli giderleri gözden geçir','Tekrarlayan gider desenleri finansal yük oluşturuyor olabilir.');
  const unique=[]; const seen=new Set(); for(const x of items){if(!seen.has(x.title)){seen.add(x.title);unique.push(x);}}
  const top=unique.slice(0,3);
  const rows=top.map(x=>`<div class="smart-proactive-row"><span class="${x.tone}">●</span><div><b>${esc(x.title)}</b><small>${esc(x.text)}</small></div></div>`).join('');
  return `<section class="card smart-card smart-proactive-card"><div class="smart-section-title"><b>Proaktif Akıllı Sistem</b><span>${top.length?`${top.length} önemli durum`:'Sakin'}</span></div>${top.length?`<div class="smart-proactive-note"><span>⚡</span><div><b>Sormana gerek yok</b><small>Önemli bir değişiklik fark ettiğimde burada gösteririm. Otomatik işlem yapılmaz.</small></div></div><div class="smart-proactive-list">${rows}</div>`:`<div class="smart-advice"><span class="smart-advice-icon">✓</span><div><b>Şu anda öncelikli bir uyarı yok.</b><small>Finansal hareketlerin normal aralıkta görünüyor.</small></div></div>`}</section>`;
}

function smartAssistant(){
  /* 13.3.86 — #15 Akıllı Asistan.
     Yalnızca mevcut finans verilerini okur; kayıt, bakiye, bütçe veya skor değiştirmez. */
  const a=smartPeriodSummary(state.smartPeriod), t=a.summary, prev=a.previousSummary;
  const income=Number(t.income)||0, expense=Number(t.expense)||0, net=Number(t.net)||0;
  const ratio=income?Math.round(expense/income*100):0, savings=income?Math.round(net/income*100):0;
  const cats={};(a.current||[]).forEach(x=>{const v=Number(x[1])||0;if(v<0&&x[4]!=='Transfer'){const k=String(x[0]||'Diğer').trim()||'Diğer';cats[k]=(cats[k]||0)+Math.abs(v)}});
  const topCat=Object.entries(cats).sort((x,y)=>y[1]-x[1])[0]||null;
  const upcoming=(state.upcoming||[]).filter(x=>x.kind==='payment'&&smartDateISO(x.date)>=localDateISO()).sort((x,y)=>smartDateISO(x.date).localeCompare(smartDateISO(y.date)));
  const next7=upcoming.filter(x=>{const d=new Date(smartDateISO(x.date)+'T00:00:00'),n=new Date(localDateISO()+'T00:00:00');return Math.round((d-n)/86400000)<=7});
  const answer=(mode)=>{
    if(mode==='summary') return income||expense?`Bu dönemde ${money(income)} gelir, ${money(expense)} gider ve ${money(net)} net durum görünüyor. Tasarruf oranı yaklaşık %${savings}.`:'Bu dönemde henüz yeterli gelir/gider kaydı yok.';
    if(mode==='expense') return topCat?`En yüksek gider kalemin ${topCat[0]}: ${money(topCat[1])}. Toplam giderlerin %${expense?Math.round(topCat[1]/expense*100):0}'ini oluşturuyor.`:'Henüz analiz edilebilecek gider kategorisi bulunmuyor.';
    if(mode==='payment') return next7.length?`Önümüzdeki 7 günde ${next7.length} ödeme var; toplam ${money(next7.reduce((n,x)=>n+(Number(x.amount)||0),0))}. En yakın ödeme: ${next7[0].title}.`:'Önümüzdeki 7 gün için kayıtlı ödeme görünmüyor.';
    if(mode==='saving') return income?`Gider oranı %${ratio}. Net tasarruf oranı %${savings}. ${savings<10?'Küçük ve düzenli bir tasarruf payı oluşturmak faydalı olabilir.':'Mevcut tasarruf alanını korumaya odaklanabilirsin.'}`:'Tasarruf oranını hesaplamak için gelir kaydı gerekiyor.';
    if(mode==='change') return prev.income||prev.expense?`Önceki döneme göre gider değişimi ${prev.expense?`${Math.round((expense/prev.expense-1)*100)}%`:'hesaplanamıyor'}. Net durum ${money(net)}.`:'Karşılaştırma için önceki dönemde yeterli veri yok.';
    return 'Mevcut finans kayıtlarını okuyarak kısa ve anlaşılır bir özet hazırlayabilirim.';
  };
  const mode=state.smartAssistantMode||'summary';
  const chips=[['summary','Genel durum'],['expense','En çok nereye harcadım?'],['payment','Yaklaşan ödemeler'],['saving','Tasarruf durumum'],['change','Önceki dönem']];
  return `<section class="card smart-card smart-assistant-card"><div class="smart-section-title"><b>Akıllı Asistan</b><span>Finans verilerine bağlı</span></div><div class="smart-assistant-head"><span class="smart-assistant-icon">✦</span><div><b>Finansını sor, birlikte okuyalım.</b><small>Yanıtlar yalnızca Fix Finans'taki mevcut kayıtlarından oluşturulur.</small></div></div><div class="smart-assistant-answer"><small>AKILLI YANIT</small><p>${esc(answer(mode))}</p></div><div class="smart-assistant-chips">${chips.map(([v,l])=>`<button type="button" class="${mode===v?'active':''}" onclick="state.smartAssistantMode='${v}';render()">${esc(l)}</button>`).join('')}</div><div class="smart-assistant-safe">🔒 Asistan kayıtlarını, bakiyeni veya bütçeni kendi başına değiştirmez.</div></section>`;
}

function smartFinancialHealthScore(t,current,previous){
  /* 13.3.88 — #17 Finans Sağlık Skoru final presentation layer.
     Mevcut calculateFinancialScore() korunur; bu bölüm yalnızca sonucu açıklar. */
  const score=calculateFinancialScore(t);
  const tone=score===null?'Veri bekleniyor':score>=80?'Çok iyi':score>=65?'İyi':score>=50?'Dengeli':'Dikkat';
  const cls=score===null?'amber':score>=65?'green':score>=50?'amber':'red';
  const savings=t.income?Math.round(t.net/t.income*100):0;
  const expenseRate=t.income?Math.round(t.expense/t.income*100):0;
  const debt=state.debts.filter(d=>d[0]==='Borç'&&!isDebtSettled(d)).reduce((a,d)=>a+Math.abs(Number(d[1])||0),0);
  const receivable=state.debts.filter(d=>d[0]==='Alacak'&&!isDebtSettled(d)).reduce((a,d)=>a+Math.abs(Number(d[1])||0),0);
  const netDebt=Math.max(0,debt-receivable);
  const explanation=score===null?'Gelir verisi oluştuğunda skor; tasarruf, gider kontrolü ve net borç baskısını birlikte değerlendirecek.':score>=80?'Tasarruf alanın güçlü, gider kontrolün iyi ve net borç baskın düşük görünüyor.':score>=65?'Finansal dengen genel olarak iyi; tasarruf ve gider oranını korumaya odaklanabilirsin.':score>=50?'Denge korunuyor ancak gider oranı, tasarruf veya borç baskısından en az biri dikkat gerektiriyor.':'Gider ve/veya borç baskısı yüksek. Öncelikle nakit dengesini güçlendirmek daha önemli.';
  const scoreValue=score===null?0:Math.max(0,Math.min(100,score));
  return `<section class="card smart-card smart-health-card smart-health-hero"><div class="smart-section-title"><b>Finans Sağlık Skoru</b><span class="${cls}">${tone}</span></div><div class="smart-health-main"><div class="smart-health-ring ${score===null?'is-empty':''}" style="--score:${scoreValue*3.6}deg"><div class="smart-health-score"><b>${score===null?'—':score}</b><small>/ 100</small></div></div><div class="smart-health-copy"><b>${esc(tone)}</b><p>${esc(explanation)}</p><button class="smart-detail-btn" type="button" onclick="openFinancialScoreDetail()">Detaylı Analiz <span>→</span></button></div></div><div class="smart-health-bars"><div><span>Tasarruf</span><b>${t.income?`%${Math.max(-100,Math.min(100,savings))}`:'—'}</b><i><em style="width:${score===null?0:Math.max(0,Math.min(100,savings*2))}%"></em></i></div><div><span>Gider kontrolü</span><b>${t.income?`%${Math.max(0,100-expenseRate)}`:'—'}</b><i><em style="width:${t.income?Math.max(0,Math.min(100,100-expenseRate)):0}%"></em></i></div><div><span>Net borç baskısı</span><b>${t.income?money(netDebt):'—'}</b><i><em style="width:${t.income?Math.max(0,Math.min(100,100-(netDebt/t.income*100))):0}%"></em></i></div></div><div class="smart-health-safe">🔒 Skor yalnızca mevcut finans verilerini değerlendirir; hiçbir kaydı veya bakiyeyi değiştirmez.</div></section>`;
}

function upcoming(){

function editUpcoming(id){const x=(state.upcoming||[]).find(v=>String(v.id)===String(id));if(!x)return;openUpcomingModal(x.kind,String(x.id))}
function saveUpcoming(kind,editId){
  const title=document.getElementById('upTitle')?.value.trim();
  if(!title){showToast('Başlık gerekli.');return}
  const amount=(kind==='payment'||kind==='income')?Number(String(document.getElementById('upAmount')?.value||0).replace(/[^0-9,.-]/g,'').replace(/\.(?=\d{3}(?:,|$))/g,'').replace(',','.')):0;
  const date=document.getElementById('upDate')?.value||localDateISO();
  const note=document.getElementById('upNote')?.value.trim()||'';
  if(editId){
    const item=(state.upcoming||[]).find(x=>String(x.id)===String(editId));
    if(item){item.kind=kind;item.title=title;item.amount=amount;item.date=date;item.note=note}
  }else{
    state.upcoming.unshift({id:Date.now().toString(),kind,title,amount,date,note})
  }
  persist();closeModal();showUpcoming()
}
function deleteUpcoming(id){state.upcoming=(state.upcoming||[]).filter(x=>String(x.id)!==String(id));persist();showUpcoming()}

  <div class="debt-sum"><div class="debtbox"><small>🔴 Toplam Borç</small><b class="red">${money(tb)}</b></div><div class="debtbox"><small>🟢 Toplam Alacak</small><b class="green">${money(ta)}</b></div></div>

function debtRow(d){

function openDebtModal(type,editIndex=null){
  const editing=Number.isInteger(editIndex), existing=editing?state.debts[editIndex]:null;
  const t=type||existing?.[0]||'Borç', created=existing?.[4]||localDateISO(), wallet=existing?.[5]==='Nakit'?'Nakit':'Banka', due=existing?.[7]||'';

function selectDebtWallet(wallet){
  const input=document.getElementById('debtWallet'); if(input)input.value=wallet;
  document.querySelectorAll('[data-debt-wallet]').forEach(btn=>btn.classList.toggle('active',btn.dataset.debtWallet===wallet));
}
function upsertDebtEvent(debt,action,wallet,amount,date){
  const id=debtId(debt); if(!id)return;
  const signed=(action==='Borç Alındı'||action==='Tahsilat Alındı')?Math.abs(amount):-Math.abs(amount);
  const color=signed>=0?'green':(action==='Borç Alındı'?'purple':'red');
  const idx=state.transactions.findIndex(t=>isDebtEventTx(t)&&String(t?.[9]||'')===id&&String(t?.[8]||'')===action);
  const rec=[action,signed,color,'', 'Borç/Alacak',`${debt[2]||'Kayıt'} · ${wallet}`,date||localDateISO(),wallet,action,id];
  if(idx>=0)state.transactions[idx]=rec; else state.transactions.unshift(rec);
}
function removeDebtEvents(debtIdValue){state.transactions=state.transactions.filter(t=>!(isDebtEventTx(t)&&String(t?.[9]||'')===String(debtIdValue)));}
function saveDebt(type,editIndex=null){
  const raw=document.getElementById('debtAmount').value||'0';
  const num=Number(String(raw).replace(/[^0-9,.-]/g,'').replace(/\.(?=\d{3}(?:,|$))/g,'').replace(',','.'))||0;
  const name=document.getElementById('debtName').value.trim()||'Kayıt';
  const note=document.getElementById('debtNote').value.trim();
  const created=document.getElementById('debtDate')?.value||localDateISO();
  const due=document.getElementById('debtDueDate')?.value||'';
  const wallet=document.getElementById('debtWallet')?.value==='Nakit'?'Nakit':'Banka';
  if(!num){showToast('Tutar gerekli.');return}
  const existing=Number.isInteger(editIndex)?state.debts[editIndex]:null;
  const status=existing?.[6]||'Açık';
  const settledAt=existing?.[8]||'';
  const id=existing?.[9]||('debt-'+Date.now()+'-'+Math.random().toString(36).slice(2,7));
  const settlementWallet=existing?.[10]||'';
  const record=[type,Math.abs(num),name,note,created,wallet,status,due,settledAt,id,settlementWallet];
  if(Number.isInteger(editIndex)){
    state.debts[editIndex]=record;
    removeDebtEvents(id);
  }else state.debts.unshift(record);
  upsertDebtEvent(record,type==='Alacak'?'Borç Verildi':'Borç Alındı',wallet,num,created);
  if(isDebtSettled(record)) upsertDebtEvent(record,type==='Alacak'?'Tahsilat Alındı':'Borç Ödendi',debtSettlementWallet(record),num,record[8]||created);
  persist();closeModal();state.page='transactions';render();
  showToast(type==='Alacak'?`${money(num)} ${wallet} bakiyesinden düşüldü.`:`${money(num)} ${wallet} bakiyesine eklendi.`);
}
function openDebtSettlementModal(i,mode){
  const d=state.debts[i];if(!d)return;
  const isCollect=mode==='collect',title=isCollect?'Tahsilat Al':'Borç Öde';
  const defaultWallet=isCollect?'Nakit':debtWallet(d);
  document.getElementById('modal').classList.remove('hidden');
  document.getElementById('modal').innerHTML=`<div class="sheet debt-settlement-sheet"><button class="close" onclick="closeModal()">×</button><div class="support-kicker"><span class="support-kicker-icon">${isCollect?'↙':'↗'}</span> ${isCollect?'TAHSİLAT':'BORÇ ÖDEME'}</div><h2>${title}</h2><div class="settings-sub">${isCollect?'Para hangi hesaba geldi?':'Ödeme hangi hesaptan yapıldı?'}</div><div class="detail-box"><b>${esc(d[2]||'Kayıt')}</b><span class="${isCollect?'green':'red'}">${money(d[1])}</span></div><label class="settlement-label">${isCollect?'Tahsilat kaynağı':'Ödeme kaynağı'}</label><div class="wallet-choice"><button type="button" data-settlement-wallet="Nakit" class="${defaultWallet==='Nakit'?'active':''}" onclick="selectDebtSettlementWallet('Nakit')">💵 Nakit</button><button type="button" data-settlement-wallet="Banka" class="${defaultWallet==='Banka'?'active':''}" onclick="selectDebtSettlementWallet('Banka')">🏦 Banka</button></div><input type="hidden" id="debtSettlementWallet" value="${defaultWallet}"><button class="save ${isCollect?'collect-debt':'pay-debt'}" onclick="confirmDebtSettlement(${i},'${mode}')">${isCollect?'Tahsilatı Al':'Ödemeyi Yap'}</button></div>`;
}
function selectDebtSettlementWallet(wallet){
  const input=document.getElementById('debtSettlementWallet');if(input)input.value=wallet;
  document.querySelectorAll('[data-settlement-wallet]').forEach(btn=>btn.classList.toggle('active',btn.dataset.settlementWallet===wallet));
}
function confirmDebtSettlement(i,mode){
  const d=state.debts[i];if(!d)return;
  const wallet=document.getElementById('debtSettlementWallet')?.value==='Nakit'?'Nakit':'Banka';
  const isCollect=mode==='collect';
  if(isCollect && (d[0]!=='Alacak'||isDebtSettled(d)))return;
  if(!isCollect && (d[0]!=='Borç'||isDebtSettled(d)))return;
  d[6]='Tahsil Edildi';d[8]=localDateISO();d[10]=wallet;
  upsertDebtEvent(d,isCollect?'Tahsilat Alındı':'Borç Ödendi',wallet,Math.abs(Number(d[1])||0),d[8]);
  persist();closeModal();state.page='transactions';render();showToast(isCollect?`${money(d[1])} ${wallet} bakiyesine eklendi.`:`${money(d[1])} ${wallet} bakiyesinden ödendi.`);
}
function reverseDebtCollection(i){
  const d=state.debts[i]; if(!d||!isDebtSettled(d))return;
  const wasCollect=d[0]==='Alacak';
  confirmAction(wasCollect?'Tahsilatı Geri Al':'Ödemeyi Geri Al',wasCollect?'Tahsilat geri alınacak ve para tahsilat kaynağından çıkacak.':'Ödeme geri alınacak ve para ödeme kaynağına geri eklenecek.',()=>{
    const id=debtId(d);d[6]='Açık';d[8]='';d[10]='';
    state.transactions=state.transactions.filter(t=>!(isDebtEventTx(t)&&String(t?.[9]||'')===id&&(String(t?.[8]||'')==='Tahsilat Alındı'||String(t?.[8]||'')==='Borç Ödendi')));
    persist();closeModal();render();showToast(wasCollect?'Tahsilat geri alındı.':'Borç ödemesi geri alındı.');
  });
}
function collectDebt(i){openDebtSettlementModal(i,'collect');}
function payDebt(i){openDebtSettlementModal(i,'pay');}
function formatDateTR(v){if(!v)return '';const d=new Date(v+'T12:00:00');return Number.isNaN(d.getTime())?v:d.toLocaleDateString('tr-TR',{day:'2-digit',month:'2-digit',year:'numeric'})}
function openDebtDetail(i){
  const d=state.debts[i];if(!d)return;
  const type=d[0], amount=Number(d[1])||0, settled=isDebtSettled(d), due=debtDueDate(d), wallet=debtWallet(d),settlement=debtSettlementWallet(d);
  const dueLabel=due?(smartDateISO(due)<localDateISO()?'Vadesi geçti':smartDateISO(due)===localDateISO()?'Bugün vade':`Vade: ${formatDateTR(due)}`):'Vade günü belirtilmedi';

  const url=URL.createObjectURL(file);
  openPhotoCrop(url);
}
function openPhotoCrop(src){
  document.getElementById('modal').classList.remove('hidden');
  document.getElementById('modal').innerHTML=`<div class="sheet crop-sheet"><button class="close" onclick="cancelPhotoCrop()">×</button><h2>Fotoğrafı Ayarla</h2><div class="crop-sub">Fotoğrafı sürükle ve yakınlaştır. Dairenin içindeki alan profil fotoğrafın olacak.</div><div class="crop-stage"><img id="cropImage" src="${src}" draggable="false" alt=""></div><div class="crop-controls"><button onclick="cropZoom(-.1)">−</button><input id="cropZoomRange" type="range" min="1" max="3" step=".01" value="1" oninput="cropZoom(this.value)"><button onclick="cropZoom(.1)">＋</button></div><button class="save" onclick="saveCroppedPhoto()">Fotoğrafı Kaydet</button></div>`;
  window.__crop={src,scale:1,x:0,y:0};
  const img=document.getElementById('cropImage');
  let sx=0,sy=0,ox=0,oy=0,drag=false;
  const down=e=>{drag=true;const p=e.touches?e.touches[0]:e;sx=p.clientX;sy=p.clientY;ox=window.__crop.x;oy=window.__crop.y;img.setPointerCapture?.(e.pointerId);e.preventDefault()};
  const move=e=>{if(!drag)return;const p=e.touches?e.touches[0]:e;window.__crop.x=ox+p.clientX-sx;window.__crop.y=oy+p.clientY-sy;applyCrop();e.preventDefault()};
  const up=()=>{drag=false};
  img.addEventListener('pointerdown',down);window.addEventListener('pointermove',move,{passive:false});window.addEventListener('pointerup',up,{passive:true});
  img.addEventListener('load',()=>applyCrop(),{once:true});
  img.addEventListener('error',()=>showToast('Fotoğraf yüklenemedi. Lütfen JPG veya PNG seç.'),{once:true});
}
function cancelPhotoCrop(){
  const src=window.__crop?.src;
  if(src&&src.startsWith('blob:'))URL.revokeObjectURL(src);
  window.__crop=null;
  accountInfo();
}
function cropZoom(v){
  if(!window.__crop)return;
  if(typeof v==='number')window.__crop.scale=Math.max(1,Math.min(3,window.__crop.scale+v));
  else window.__crop.scale=Math.max(1,Math.min(3,Number(v)||1));
  const r=document.getElementById('cropZoomRange');if(r)r.value=window.__crop.scale;
  applyCrop();
}
function applyCrop(){
  const img=document.getElementById('cropImage');
  const stage=document.querySelector('.crop-stage');
  if(!img||!stage||!img.naturalWidth||!img.naturalHeight)return;
  const size=stage.clientWidth||280;
  const base=Math.max(size/img.naturalWidth,size/img.naturalHeight);
  img.style.width=(img.naturalWidth*base)+'px';
  img.style.height=(img.naturalHeight*base)+'px';
  img.style.transform=`translate(calc(-50% + ${window.__crop.x}px),calc(-50% + ${window.__crop.y}px)) scale(${window.__crop.scale})`;
}
function saveCroppedPhoto(){
  const src=window.__crop?.src;
  if(!src)return;
  const image=new Image();
  image.onload=()=>{
    const stageEl=document.querySelector('.crop-stage');
    const stage=stageEl?.clientWidth||280;
    const size=320;
    const canvas=document.createElement('canvas');canvas.width=size;canvas.height=size;
    const ctx=canvas.getContext('2d');
    if(!ctx){showToast('Fotoğraf kaydedilemedi.');return}
    ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';
    const base=Math.max(stage/image.naturalWidth,stage/image.naturalHeight);
    const scale=base*(window.__crop.scale||1);
    const dw=image.naturalWidth*scale,dh=image.naturalHeight*scale;
    const x=(size/2)+(window.__crop.x*(size/stage))-dw/2;
    const y=(size/2)+(window.__crop.y*(size/stage))-dh/2;
    ctx.fillStyle='#000';ctx.fillRect(0,0,size,size);
    ctx.drawImage(image,x,y,dw,dh);
    let data='';
    try{data=canvas.toDataURL('image/jpeg',.76);localStorage.setItem('fix_profile_photo',data)}catch(e){
      try{data=canvas.toDataURL('image/jpeg',.58);localStorage.setItem('fix_profile_photo',data)}catch(e2){showToast('Fotoğraf kaydedilemedi. Eski fotoğrafı temizleyip tekrar dene.');return}
    }
    if(!data||data.length<500){showToast('Fotoğraf kaydedilemedi.');return}
    if(src.startsWith('blob:'))URL.revokeObjectURL(src);
    window.__crop=null;
    closeModal();render();
  };
  image.onerror=()=>showToast('Fotoğraf yüklenemedi. Lütfen JPG veya PNG seç.');
  image.src=src;
}

function applyFontSize(){
  const v=localStorage.getItem('fix_font_size')||'system';
  document.body.classList.remove('font-size-small','font-size-large','font-size-system');
  document.body.classList.add('font-size-'+v);

  /* Eski 13.3.72/13.3.80 inline font ölçeklemesini tamamen temizle.
     Böylece üst üste binmiş CSS/inline değerleri yeni sistemi ezemez. */
  document.body.querySelectorAll('[data-ff-base-font-size]').forEach(el=>{
    el.style.removeProperty('font-size');
    delete el.dataset.ffBaseFontSize;
  });
  document.body.querySelectorAll('[style]').forEach(el=>{
    if(el.style.fontSize && el.dataset.ffLegacyFontSize==='1'){
      el.style.removeProperty('font-size');
      delete el.dataset.ffLegacyFontSize;
    }
  });

  document.documentElement.style.setProperty(
    '-webkit-text-size-adjust',
    v==='system'?'auto':'100%'
  );
}

async function getJson(url){
  const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),8000);
  try{const r=await fetch(url,{cache:'no-store',headers:{'Accept':'application/json'},signal:controller.signal});if(!r.ok)throw new Error('rate');return r.json()}
  finally{clearTimeout(timer)}
}
async function fetchMarketRates(){
  if(marketRates.loading)return;
  marketRates.loading=true;renderCurrencySheet();
  const next={...marketRates,loading:false};let changed=false;
  const save=()=>{next.loading=false;if(changed){next.updated=new Date().toISOString();marketRates=next;localStorage.setItem('fix_market_rates',JSON.stringify(marketRates))}else marketRates={...marketRates,loading:false}};
  try{const fx=await getJson('https://api.frankfurter.dev/v2/rate/USD/TRY');const rate=Number(fx?.rate);if(rate>0){next.usdtry=rate;changed=true}}catch(e){}
  try{const btc=await getJson('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=try');const v=Number(btc?.bitcoin?.try);if(v>0){next.btc=v;changed=true}}catch(e){
    try{const btc=await getJson('https://api.binance.com/api/v3/ticker/price?symbol=BTCUSDT');const usd=Number(btc?.price);if(usd>0&&Number(next.usdtry)>0){next.btc=usd*Number(next.usdtry);changed=true}}catch(_){}}
  try{const gold=await getJson('https://api.gold-api.com/price/XAU');const v=Number(gold?.price??gold?.value??gold);if(v>0&&Number(next.usdtry)>0){next.gold=v*Number(next.usdtry);changed=true}}catch(e){}
  try{const silver=await getJson('https://api.gold-api.com/price/XAG');const v=Number(silver?.price??silver?.value??silver);if(v>0&&Number(next.usdtry)>0){next.silver=v*Number(next.usdtry);changed=true}}catch(e){}
  save();renderCurrencySheet();
}

function backupHistoryRead(){
  try{
    const h=JSON.parse(localStorage.getItem('fix_backup_history')||'[]');
    if(!Array.isArray(h))return[];
    /* Eski sürümlerde oluşmuş işlem yapılmadan görünen legacy kayıtları gösterme.
       Yeni gerçek yedekler source:'user-action' veya source:'auto' damgası taşır. */
    return h.filter(x=>x&&(['user-action','auto'].includes(x.source)||x.__backupV==='2'));
  }catch(e){return[]}
}
function backupHistoryWrite(list){localStorage.setItem('fix_backup_history',JSON.stringify(list.slice(0,12)))}
function backupSize(payload){return new Blob([JSON.stringify(payload)]).size}
function formatBytes(bytes){
  const n=Number(bytes)||0;
  if(n<1024)return n+' B';
  if(n<1024*1024)return (n/1024).toFixed(1)+' KB';
  return (n/1024/1024).toFixed(2)+' MB';
}
function saveBackupToHistory(payload,auto=false){
  const raw=JSON.stringify(payload);
  const history=backupHistoryRead();
  const item={id:Date.now().toString(),createdAt:payload.createdAt,size:raw.length,transactions:payload.transactions.length,debts:payload.debts.length,upcoming:payload.upcoming.length,auto,source:auto?'auto':'user-action',__backupV:'2',payload};
  history.unshift(item);backupHistoryWrite(history);
  localStorage.setItem('fix_last_backup',payload.createdAt);
  return item;
}
function backupFileName(payload){
  return 'fix-finans-yedek-'+new Date(payload.createdAt).toISOString().slice(0,19).replace(/[:T]/g,'-')+'.json';
}
function downloadBackupPayload(payload){
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});

function backupRestorePayload(payload,parts){
  if(!payload||payload.app!=='Fix Finans'||!Array.isArray(payload.transactions))throw new Error('invalid');
  const p=parts||{transactions:true,debts:true,upcoming:true,categories:true,settings:true,profile:true};
  if(p.transactions)state.transactions=payload.transactions;
  if(p.debts)state.debts=Array.isArray(payload.debts)?payload.debts:[];
  if(p.upcoming)state.upcoming=Array.isArray(payload.upcoming)?payload.upcoming:[];
  if(Array.isArray(payload.recurring))state.recurring=payload.recurring;
  if(Array.isArray(payload.financialGoals))state.financialGoals=payload.financialGoals;
  if(p.categories)state.customCategories=payload.customCategories&&typeof payload.customCategories==='object'?payload.customCategories:{Gelir:[],Gider:[]};
  if(payload.localStorage&&typeof payload.localStorage==='object'){
    const settings=['fix_theme','fix_palette','fix_font_size','fix_excel_enabled','fix_balance_hidden',GOAL_KEY,RECURRING_KEY];
    const profile=['fix_profile_name','fix_profile_mail','fix_profile_photo'];
    const selected=[...(p.settings?settings:[]),...(p.profile?profile:[])];
    selected.forEach(k=>{if(payload.localStorage[k]!==undefined)localStorage.setItem(k,payload.localStorage[k])});
  }
  state.filters=payload.filters&&typeof payload.filters==='object'?payload.filters:{from:'',to:'',category:'Tümü'};
  persist();
  applyFontSize();
  closeModal();render();
  showToast('Yedek başarıyla geri yüklendi.');
}

function backupHistoryRows(list,limit){
  const rows=(limit?list.slice(0,limit):list);
  if(!rows.length)return '<div class="empty">Henüz kayıtlı yedek yok.</div>';
  return rows.map(h=>{
    const when=new Date(h.createdAt).toLocaleString('tr-TR');
    const auto=h.auto?' · otomatik':'';
    return '<div class="backup-history-row"><span class="bh-icon">▤</span><div><b>'+esc(when)+'</b><small>'+h.transactions+' işlem · '+h.debts+' borç/alacak · '+formatBytes(h.size)+auto+'</small></div><span><button onclick="restoreHistory(\''+esc(h.id)+'\')">↩</button><button onclick="deleteBackupHistory(\''+esc(h.id)+'\')">×</button></span></div>';
  }).join('');
}

function bindHomeTabSwipe(){
  const page=document.getElementById('page');
  if(!page || state.page!=='home' || page.dataset.homeSwipeBound==='1') return;
  page.dataset.homeSwipeBound='1';
  let startX=0,startY=0,tracking=false;
  page.addEventListener('touchstart',e=>{
    if(e.touches.length!==1) return;
    startX=e.touches[0].clientX;
    startY=e.touches[0].clientY;
    tracking=true;
  },{passive:true});
  page.addEventListener('touchend',e=>{
    if(!tracking || !e.changedTouches.length) return;
    tracking=false;
    const dx=e.changedTouches[0].clientX-startX;
    const dy=e.changedTouches[0].clientY-startY;
    if(Math.abs(dx)<65 || Math.abs(dx)<=Math.abs(dy)*1.25) return;
    const order=['home','reports','upcoming'];
    const current=order.indexOf(state.page);
    const next=dx<0 ? Math.min(order.length-1,current+1) : Math.max(0,current-1);
    if(next!==current){
      state.page=order[next];
      render();
    }
  },{passive:true});
}

let lastRenderedPage=null;
function animateNetBalance(){
  const el=document.querySelector('.net-balance-counter');
  if(!el || el.textContent.includes('•') || el.dataset.animating==='1') return;
  const target=Number(el.dataset.balanceValue||0);
  if(!Number.isFinite(target)) return;
  const duration=2200;
  const start=performance.now();
  const ease=t=>1-Math.pow(1-t,3);
  el.dataset.animating='1';
  const tick=now=>{
    const p=Math.min(1,(now-start)/duration);
    const value=target*ease(p);
    el.textContent=money(value);
    if(p<1){requestAnimationFrame(tick);}else{el.textContent=money(target);delete el.dataset.animating;}
  };
  requestAnimationFrame(tick);
}

  if(pullStartY===null||e.touches.length!==1)return;
  if(window.scrollY>2||document.querySelector('.modal:not(.hidden)')){resetPullGesture();return;}
  const t=e.touches[0],dy=t.clientY-pullStartY,dx=Math.abs(t.clientX-pullStartX);
  if(dy>20&&dy>Math.abs(dx)*0.75){
    pullIndicator.classList.add('show');
    pullIndicator.textContent=dy>85?'↻ Bırakınca yenilenecek':'↓ Yenilemek için bırak';
    if(pullResetTimer)clearTimeout(pullResetTimer);
    pullResetTimer=setTimeout(resetPullGesture,4000);
  }
},{passive:true});
function finishPullTouch(e){
  if(pullStartY===null)return;
  const t=e.changedTouches&&e.changedTouches[0];
  const dy=t?t.clientY-pullStartY:0;
  const dx=t?Math.abs(t.clientX-pullStartX):0;
  const shouldRefresh=dy>85&&dy>dx*0.75&&!pullTriggered&&!document.querySelector('.modal:not(.hidden)')&&window.scrollY<=2;
  if(shouldRefresh){pullTriggered=true;resetPullGesture();refreshApp();}
  else resetPullGesture();
}
document.addEventListener('touchend',finishPullTouch,{passive:true});
document.addEventListener('touchcancel',resetPullGesture,{passive:true});
window.addEventListener('blur',resetPullGesture);
window.addEventListener('pagehide',resetPullGesture);
document.addEventListener('visibilitychange',()=>{if(document.hidden)resetPullGesture();});
window.addEventListener('scroll',()=>{if(window.scrollY>2)resetPullGesture();},{passive:true});


</script>

        showToast('Google hesabı bağlandı.');

})();

<script>
(function(){
  /* 13.3.88 — final Akıllı Finans kontrolü + #16/#17 */
  const originalRender=window.render;
  const paletteVars={
    purple:['#743cff','#4c1ed4'],blue:['#3b82f6','#1d4ed8'],green:['#16c784','#087f5b'],
    amber:['#f5a524','#c87805'],cyan:['#19c6d8','#087f8c'],rose:['#ec4899','#be185d'],
    red:['#ef4444','#b91c1c'],slate:['#94a3b8','#64748b']
  };
  function applyPalette(){
    const p=localStorage.getItem('fix_palette')||'purple';
    const v=paletteVars[p]||paletteVars.purple;
    document.body.dataset.palette=p;
    document.body.style.setProperty('--theme-accent',v[0]);
    document.body.style.setProperty('--theme-accent-2',v[1]);
  }
  function cleanupStrayBrace(){
    document.querySelectorAll('.page *').forEach(el=>{
      if(el.children.length===0 && el.textContent.trim()==='}') el.remove();
    });
  }
  function patchProfile(){
    const guest=sessionStorage.getItem('fix_guest_session')==='1' && !window.fixFirebaseUser;
    if(!guest)return;
    localStorage.removeItem('fix_profile_name');
    localStorage.removeItem('fix_profile_mail');
  }
  const renderPatched=function(){applyPalette();applyFontSize();patchProfile();originalRender.apply(this,arguments);applyPalette();applyFontSize();cleanupStrayBrace();};
  window.render=renderPatched;
  applyPalette();
  applyFontSize();
  patchProfile();
  cleanupStrayBrace();
  /* Replace the profile top gear with the selected gear-refresh style. */
  window.__fixFinalPass=true;
})();
</script>
